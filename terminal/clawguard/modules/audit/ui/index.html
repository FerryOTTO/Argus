  function destroyNebulaGraph() {
    state.nebula.instance?.destroy();
    state.nebula.instance=null;
  }

  let nebulaResizeFrame=null,nebulaViewFrame=null,nebulaRevealFrame=null;
  function cancelNebulaViewTransition() {
    if(nebulaViewFrame)cancelAnimationFrame(nebulaViewFrame);nebulaViewFrame=null;
    if(nebulaRevealFrame)cancelAnimationFrame(nebulaRevealFrame);nebulaRevealFrame=null;
  }
  function scheduleNebulaResize() {
    if(nebulaResizeFrame)cancelAnimationFrame(nebulaResizeFrame);
    nebulaResizeFrame=requestAnimationFrame(()=>{
      nebulaResizeFrame=null;
      if(state.viewMode==="nebula")state.nebula.instance?.resize();
    });
  }

  function syncNebulaFullscreen() {
    const shell=$("#nebulaShell"),button=$("#nebulaFullscreenBtn");
    const active=document.fullscreenElement===shell||shell.classList.contains("is-fullscreen");
    button.textContent=active?"退出全屏":"全屏查看";
    button.setAttribute("aria-pressed",String(active));
    scheduleNebulaResize();
  }

  async function toggleNebulaFullscreen() {
    const shell=$("#nebulaShell");
    if (document.fullscreenElement===shell) { await document.exitFullscreen?.();return; }
    if (shell.classList.contains("is-fullscreen")) { shell.classList.remove("is-fullscreen");syncNebulaFullscreen();return; }
    if (shell.requestFullscreen) {
      try { await shell.requestFullscreen();return; }
      catch { shell.classList.add("is-fullscreen"); }
    } else shell.classList.add("is-fullscreen");
    syncNebulaFullscreen();
  }

  function renderNebula({animateEntrance:entranceOverride}={}) {
    const empty=$("#nebulaEmpty"),svg=$("#nebulaGraph");
    if(!state.trace){destroyNebulaGraph();svg.hidden=true;empty.hidden=false;empty.innerHTML=`<div><strong>${state.traces.length?"请选择一个 Trace":"暂无审计任务"}</strong><span>星云图只显示现有 Audit API 返回的真实事件。</span></div>`;return;}
    if(!orderedNodes().length){destroyNebulaGraph();svg.hidden=true;empty.hidden=false;empty.innerHTML='<div><strong>当前 Trace 没有事件</strong><span>未生成任何演示节点。</span></div>';return;}
    if(!(window.SVGSVGElement&&document.createElementNS)){destroyNebulaGraph();svg.hidden=true;empty.hidden=false;empty.innerHTML='<div><strong>浏览器不支持 SVG</strong><span>请使用现代浏览器查看星云图；工具调用链仍可正常使用。</span></div>';return;}
    svg.hidden=false;empty.hidden=true;
    if(!state.nebula.instance)state.nebula.instance=createNebulaGraph();
    const traceId=state.trace.trace_id,animateEntrance=entranceOverride??state.nebula.lastDisplayedTraceId!==traceId;
    state.nebula.instance.setTrace(state.trace,{animateEntrance,clusterEntrance:animateEntrance});
    state.nebula.lastDisplayedTraceId=traceId;
  }

  async function loadNebulaPath(mode) {
    if(mode==="all"){state.nebula.pathMode="all";state.graph.pathMode="all";state.pathResult=null;state.nebula.instance?.refreshStyles();return;}
    const source=state.trace?.nodes.find(node=>node.event_id===state.nebula.focusRiskId&&node.direct_risk_source)||state.trace?.nodes.find(node=>node.event_id===state.selectedEventId&&node.direct_risk_source)||state.trace?.nodes.find(node=>node.direct_risk_source);
    if(!source){toast("当前 Trace 没有可调查的直接风险源");return;}
    state.nebula.focusRiskId=source.event_id;state.nebula.pathMode=mode;state.graph.pathMode=mode;state.pathMode=mode;
    const direction=mode==="impact"?"impacts":"causes";
    try{state.pathResult=await requestJson(`/v1/audit/events/${encodeURIComponent(source.event_id)}/${direction}?${PATH_QUERY}`);state.nebula.instance?.refreshStyles();if(state.drawerOpen&&state.selectedEventId===source.event_id)renderDrawer();setApiStatus("ok");}
    catch(error){setApiStatus("error",friendlyError(error,"路径查询失败"));}
  }

  function renderEvidenceGraph() {
    const svg = $("#traceGraph");
    const empty = $("#graphEmpty");
    const wrap = $("#graphViewportWrap");
    const viewportWidth=Math.max(620,Math.floor((wrap?.clientWidth || 960)-2));
    const model = graphModel(viewportWidth,state.graph.fit);
    if (!model.nodes.length) {
      svg.hidden = true;
      empty.hidden = false;
      return;
    }
    svg.hidden = false;
    empty.hidden = true;
    svg.setAttribute("aria-label","Trace 事件证据图");
    svg.setAttribute("viewBox", `0 0 ${model.width} ${model.height}`);
    svg.setAttribute("width", "100%");
    svg.setAttribute("height", model.height);
    svg.setAttribute("preserveAspectRatio", "xMidYMin meet");
    svg.style.width = "100%";
    svg.style.height = `${model.height}px`;
    const highlighted = pathSets();
    $("#graphEdges").innerHTML = model.edges.map(edge => {
      const from=model.positions.get(edge.source),to=model.positions.get(edge.target);
      if (!from || !to) return "";
      const active = highlighted?.edges.has(edge.key);
      return `<path class="graph-edge ${edge.temporal ? "temporal" : "direct"} ${active ? "is-highlighted" : ""} ${highlighted && !active ? "is-faded" : ""}" data-graph-edge="${escapeHtml(edge.key)}" d="${graphEdgePath(from,to)}" marker-end="url(#arrow-${edge.temporal ? "temporal" : "direct"})"><title>${escapeHtml(edge.temporal ? "时序推断，不代表确定因果" : `${edge.relation} · 明确关系`)}</title></path>`;
    }).join("");
    $("#graphNodes").innerHTML = model.nodes.map(node => {
      const pos=model.positions.get(node.event_id),active=highlighted?.nodes.has(node.event_id);
      const faded=highlighted&&!active;
      return `<g class="graph-node ${node.event_id===state.selectedEventId?"is-selected":""} ${node.direct_risk_source?"is-risk-source":""} ${node.impacted?"is-impacted":""} ${node.action==="block"?"is-blocked":""} ${faded?"is-unrelated":""}" data-graph-node="${escapeHtml(node.event_id)}" tabindex="0" role="button" transform="translate(${pos.x} ${pos.y})"><title>${escapeHtml(`${eventTitle(node)} · ${node.event_id}`)}</title><rect class="node-card" width="${pos.width}" height="${pos.height}"></rect><rect class="node-accent" width="5" height="${pos.height}"></rect><text class="node-title" x="16" y="25">${escapeHtml(compact(eventTitle(node), 30))}</text><text class="node-subtitle" x="16" y="46">${escapeHtml(moduleLabel(node.source_module))}</text><text class="node-action" x="16" y="69">${escapeHtml(actionShort[node.action] || node.action.toUpperCase())}</text><text class="node-risk" x="${pos.width-16}" y="69" text-anchor="end">Risk ${node.risk_score.toFixed(2)}</text></g>`;
    }).join("");
    $$('[data-graph-node]').forEach(node => {
      node.addEventListener("click", () => selectEvent(node.dataset.graphNode));
      node.addEventListener("keydown", event => { if (["Enter"," "].includes(event.key)) { event.preventDefault(); selectEvent(node.dataset.graphNode); } });
    });
  }

  function renderGraph() {
    if (state.graph.mode === "evidence") renderEvidenceGraph();
    else renderTaskFlowGraph();
  }

  function setViewMode(mode) {
    if (!["timeline","nebula"].includes(mode)) return;
    cancelNebulaViewTransition();
    state.viewMode = mode;
    $("#timeline").hidden = mode !== "timeline";
    const shell=$("#nebulaShell");shell.hidden = mode !== "nebula";
    $$('[data-view]').forEach(button => {
      const active=button.dataset.view===mode;
      button.classList.toggle("active",active);
      button.setAttribute("aria-selected",String(active));
    });
    $(".trace-heading h2").textContent=mode==="nebula"?"审计星云图":"工具调用链";
    if (mode === "nebula") {
      shell.classList.add("is-preparing");
      nebulaViewFrame=requestAnimationFrame(()=>{nebulaViewFrame=null;renderNebula();nebulaRevealFrame=requestAnimationFrame(()=>{nebulaRevealFrame=null;shell.classList.remove("is-preparing");});});
    } else {shell.classList.remove("is-preparing");destroyNebulaGraph();}
  }

  function initializeGraphModeControls() {
    const pathTabs=$(".graph-path-tabs");
    if (!pathTabs || $(".graph-mode-tabs")) return;
    const modeTabs=document.createElement("div");
    modeTabs.className="graph-mode-tabs";
    modeTabs.setAttribute("role","tablist");
    modeTabs.setAttribute("aria-label","因果图投影视图");
    modeTabs.innerHTML='<button class="btn graph-mode-btn active" type="button" data-graph-mode="task" role="tab" aria-selected="true">任务流程</button><button class="btn graph-mode-btn" type="button" data-graph-mode="evidence" role="tab" aria-selected="false">事件证据</button>';
    pathTabs.before(modeTabs);
  }

  function rawEventOnly(event) {
    const keys=["event_id","trace_id","session_id","user_id","timestamp","stage","source_module","action","risk_score","reason","content","metadata"];
    return Object.fromEntries(keys.map(key => [key,event[key]]));
  }

  function foldMarkup(title,value,key) {
    const open=state.expandedDetailKeys.has(key) ? " open" : "";
    return `<details class="fold" data-detail-key="${escapeHtml(key)}"${open}><summary>${escapeHtml(title)}</summary><pre>${escapeHtml(JSON.stringify(value,null,2))}</pre></details>`;
  }

  function edgeRows(edges) {
    return edges.length ? edges.map(edge => `<button class="btn related-event" data-jump="${escapeHtml(edge.source === state.selectedEventId ? edge.target : edge.source)}">${escapeHtml(shortId(edge.source))} → ${escapeHtml(shortId(edge.target))} · ${escapeHtml(edge.relation)}${edge.inference === "temporal_sequence" ? "（时序推断）" : ""}</button>`).join("") : '<span class="tiny">无</span>';
  }

  function renderPathResult() {
    const result=state.pathResult;
    if (!result) return "";
    const nodes=new Map(asArray(result.nodes).map(item => {
      const node=adaptEventNode(item);
      return [node.event_id,node];
    }));
    const direction=result.direction === "causes" ? "原因链" : "影响链";
    if (!asArray(result.paths).length) return `<section class="detail-section"><h3>${direction}</h3><p class="tiny">没有可展示的路径</p></section>`;
    return `<section class="detail-section"><h3>${direction}</h3><p class="tiny">结果直接来自后端有界 BFS；时序边只表示先后，不代表确定因果。</p>${result.paths.map((path,pathIndex) => {
      const ids=result.direction === "causes" ? [...path.nodes].reverse() : [...path.nodes];
      return `<div class="path-card"><strong>${pathIndex === 0 ? "主要" : "补充"}${direction}</strong>${ids.map((id,index) => {
        const node=nodes.get(id);
        if (!node) return "";
        const previous=ids[index-1];
        const edge=previous ? asArray(path.edges).find(item => (item.source===previous&&item.target===id)||(item.source===id&&item.target===previous)) : null;
        const arrow=index ? `<div class="path-arrow ${edge?.inference==="temporal_sequence"?"inferred":""}">↓ ${edge?.inference==="temporal_sequence"?"时序推断（非确定因果）":"明确 PARENT_OF 关系"}</div>` : "";
        return `${arrow}<button class="btn related-event" data-jump="${escapeHtml(node.event_id)}"><b>${escapeHtml(eventTitle(node))} · ${escapeHtml(moduleLabel(node.source_module))}</b><br><small>${escapeHtml(displayOperation(node))} · Risk ${node.risk_score.toFixed(2)}</small></button>`;
      }).join("")}</div>`;
    }).join("")}${result.truncated?'<p class="tiny">结果达到查询上限，已截断。</p>':""}</section>`;
  }

  function bindDrawerInteractions() {
    $$('[data-detail-key]').forEach(details => details.addEventListener("toggle", () => {
      if (details.open) state.expandedDetailKeys.add(details.dataset.detailKey);
      else state.expandedDetailKeys.delete(details.dataset.detailKey);
    }));
    $$('[data-jump]').forEach(button => button.addEventListener("click", () => selectEvent(button.dataset.jump)));
    $$('[data-copy]').forEach(button => button.addEventListener("click", () => copyText(button.dataset.copy)));
    $$('[data-path]').forEach(button => button.addEventListener("click", () => loadPaths(button.dataset.path)));
    $("#expandAll")?.addEventListener("click", () => $$('[data-detail-key]').forEach(details => { details.open=true; }));
    $("#collapseAll")?.addEventListener("click", () => $$('[data-detail-key]').forEach(details => { details.open=false; }));
    $("#exportTrace")?.addEventListener("click", exportTrace);
  }

  function renderDrawer() {
    const drawer=$("#drawer"),mask=$("#drawerMask"),event=state.event;
    drawer.classList.toggle("open",state.drawerOpen);
    mask.classList.toggle("open",state.drawerOpen);
    drawer.setAttribute("aria-hidden",String(!state.drawerOpen));
    if (!state.drawerOpen) return;
    if (!event) {
      $("#drawerSub").textContent="正在读取真实 Event API";
      $("#drawerBody").innerHTML='<div class="loading">正在加载事件详情…</div>';
      return;
    }
    $("#drawerSub").textContent=`${event.event_id} · ${event.trace_id}`;
    const score=Math.max(0,Math.min(1,event.risk_score));
    const reviewDismissed=event.risk_review_status === "dismissed";
    const heroClass=event.direct_risk_source ? (score>=.8?"risk-high":"risk-watch") : "";
    const relationButton=(item,label)=>`<button class="btn related-event" data-jump="${escapeHtml(item.event_id)}">${label} · ${escapeHtml(stageLabel(item.stage))} · ${escapeHtml(shortId(item.event_id))}</button>`;
    const parentButtons=asArray(event.parents).map(item=>relationButton(item,"父事件")).join("") || '<span class="tiny">无</span>';
    const childButtons=asArray(event.children).map(item=>relationButton(item,"子事件")).join("") || '<span class="tiny">无</span>';
    const canInvestigate=event.direct_risk_source === true;
    $("#drawerBody").innerHTML=`<div class="drawer-actions"><button class="btn" data-copy="${escapeHtml(event.event_id)}">复制 Event ID</button><button class="btn" data-copy="${escapeHtml(event.trace_id)}">复制 Trace ID</button><button class="btn" id="expandAll">展开全部</button><button class="btn" id="collapseAll">收起全部</button><button class="btn primary" id="exportTrace">导出当前 Trace</button></div>
      <div class="detail-hero ${heroClass}"><div class="hero-top"><div><div class="hero-kicker">${escapeHtml(moduleLabel(event.source_module))}</div><div class="big">${escapeHtml(eventTitle(event))}</div></div><span class="hero-state ${escapeHtml(actionClass(event.action))}">${escapeHtml(actionShort[event.action] || event.action.toUpperCase())}</span></div><div class="small">${escapeHtml(displayOperation(event))}<br>${escapeHtml(event.reason || "未记录原因")}</div><div class="risk-line"><span>Risk ${score.toFixed(2)}</span><span>${reviewDismissed?"已人工标记无风险":event.direct_risk_source?"后端直接风险源":"非直接风险源"}</span></div><div class="risk-meter"><i style="width:${score*100}%"></i></div></div>
      <div class="kv"><div>event_id</div><div>${escapeHtml(event.event_id)}</div><div>trace_id</div><div>${escapeHtml(event.trace_id)}</div><div>session_id</div><div>${escapeHtml(event.session_id)}</div><div>user_id</div><div>${escapeHtml(event.user_id)}</div><div>timestamp</div><div>${escapeHtml(event.timestamp)}</div><div>stage</div><div>${escapeHtml(event.stage)}</div><div>source_module</div><div>${escapeHtml(event.source_module)}</div><div>action / risk_score</div><div>${escapeHtml(event.action)} / ${score}</div><div>direct_risk_source</div><div>${event.direct_risk_source}</div><div>original_direct_risk_source</div><div>${event.original_direct_risk_source === true}</div><div>risk_review_status</div><div>${escapeHtml(event.risk_review_status || "未复核")}</div><div>reason</div><div>${escapeHtml(event.reason)}</div></div>
      <section class="detail-section"><h3>关联事件</h3><p class="tiny">实线 PARENT_OF 表示明确父子关系；temporal_sequence 仅表示先后。</p><div class="related">${parentButtons}${childButtons}</div></section>
      <section class="detail-section"><h3>入边</h3><div class="related">${edgeRows(asArray(event.incoming_edges).map(adaptEdge))}</div><h3>出边</h3><div class="related">${edgeRows(asArray(event.outgoing_edges).map(adaptEdge))}</div></section>
      <section class="detail-section"><h3>原始字段</h3>${foldMarkup("content（展开查看）",event.content,`${event.event_id}:content`)}${foldMarkup("metadata（展开查看）",event.metadata,`${event.event_id}:metadata`)}${foldMarkup("完整 AuditEvent JSON（展开查看）",rawEventOnly(event),`${event.event_id}:raw`)}</section>
      <section class="detail-section"><h3>路径分析</h3><div class="path-tabs"><button class="btn path-tab ${state.pathMode==="cause"?"active":""}" data-path="cause" ${canInvestigate?"":"disabled"}>查原因</button><button class="btn path-tab ${state.pathMode==="impact"?"active":""}" data-path="impact" ${canInvestigate?"":"disabled"}>查影响</button></div><p class="tiny">${canInvestigate?"查询将调用后端 causes / impacts API。":"该事件不是后端标记的直接风险源，不能作为溯源起点。"}</p></section>${renderPathResult()}`;
    bindDrawerInteractions();
  }

  async function loadPaths(mode) {
    const event=state.event;
    if (!event?.direct_risk_source) return;
    const direction=mode === "impact" ? "impacts" : "causes";
    state.pathMode=mode;
    state.graph.pathMode=mode;
    state.nebula.pathMode=mode;
    state.nebula.focusRiskId=event.event_id;
    $$('[data-graph-path]').forEach(item=>item.classList.toggle("active",item.dataset.graphPath===mode));
    try {
      state.pathResult=await requestJson(`/v1/audit/events/${encodeURIComponent(event.event_id)}/${direction}?${PATH_QUERY}`);
      renderDrawer();
      if (state.viewMode === "nebula") state.nebula.instance?.refreshStyles();
    } catch (error) {
      setApiStatus("error",friendlyError(error,"路径查询失败"));
    }
  }

  async function loadTrace(traceId,{refreshEvent=false}={}) {
    const token=++state.traceRequestToken;
    try {
      const payload=await requestJson(`/v1/audit/traces/${encodeURIComponent(traceId)}`);
      if (token!==state.traceRequestToken || state.selectedTraceId!==traceId) return;
      const trace=adaptTraceDetail(payload);
      state.trace=trace;
      state.traceCache.set(traceId,trace);
      if (state.selectedEventId && !trace.nodes.some(node=>node.event_id===state.selectedEventId)) {
        state.selectedEventId=null;
        state.event=null;
        state.drawerOpen=false;
        state.pathResult=null;
      }
      renderWorkspace();
      if (refreshEvent && state.drawerOpen && state.selectedEventId) {
        const eventOk=await loadEvent(state.selectedEventId,{preservePath:true});
        if (!eventOk) return false;
      }
      setApiStatus("ok");
      return true;
    } catch (error) {
      setApiStatus("error",friendlyError(error,"Trace 读取失败"));
      return false;
    }
  }

  async function selectTrace(traceId) {
    if (!state.traces.some(trace=>trace.id===traceId)) return;
    const changed=state.selectedTraceId!==traceId;
    if (changed) {
      closeTracePopover();
      state.selectedTraceId=traceId;
      state.selectedEventId=null;
      state.event=null;
      state.drawerOpen=false;
      state.pathResult=null;
      state.graph.pathMode="all";
      state.nebula.pathMode="all";
      state.nebula.focusRiskId=null;
    }
    renderTraceList();
    const cached=state.traceCache.get(traceId);
    state.trace=cached||null;
    renderWorkspace();
    await loadTrace(traceId);
  }

  async function loadEvent(eventId,{preservePath=false}={}) {
    const token=++state.eventRequestToken;
    try {
      const payload=await requestJson(`/v1/audit/events/${encodeURIComponent(eventId)}`);
      if (token!==state.eventRequestToken || state.selectedEventId!==eventId) return;
      state.event={...payload,direct_risk_source:payload.direct_risk_source===true,content:asObject(payload.content),metadata:asObject(payload.metadata)};
      if (!preservePath) state.pathResult=null;
      renderDrawer();
      setApiStatus("ok");
      return true;
    } catch (error) {
      setApiStatus("error",friendlyError(error,"Event 读取失败"));
      return false;
    }
  }

  async function selectEvent(eventId) {
    const node=state.trace?.nodes.find(item=>item.event_id===eventId);
    if (!node) return;
    state.selectedEventId=eventId;
    state.event=null;
    state.drawerOpen=true;
    state.pathResult=null;
    state.graph.pathMode="all";
    state.nebula.pathMode="all";
    if (!node.direct_risk_source) state.nebula.focusRiskId=null;
    renderTimeline();
    if (state.viewMode==="nebula") renderNebula();
    renderDrawer();
    await loadEvent(eventId);
  }

  function renderWorkspace() {
    renderTraceList();
    renderTraceHeader();
    renderTimeline();
    if (state.viewMode==="nebula") renderNebula();
    renderDrawer();
  }

  async function refreshAll({initial=false}={}) {
    const generation=++state.refreshGeneration;
    setApiStatus("loading");
    try {
      const activeMod = state.fixedModule || state.filters.module;
      const modQuery = activeMod && activeMod !== "all" && activeMod !== "audit" ? `module=${encodeURIComponent(activeMod)}` : "";
      const overviewUrl = modQuery ? `/v1/audit/overview?${modQuery}` : "/v1/audit/overview";
      const tracesUrl = modQuery ? `/v1/audit/traces?limit=200&offset=0&${modQuery}` : "/v1/audit/traces?limit=200&offset=0";

      const [overviewPayload,tracesPayload]=await Promise.all([
        requestJson(overviewUrl),
        requestJson(tracesUrl),
      ]);
      if (generation!==state.refreshGeneration) return;
      const overview=adaptOverview(overviewPayload);
      const traces=asArray(tracesPayload.items).map(adaptTraceSummary);
      state.overview=overview;
      state.traces=traces;
      const availableTraceIds=new Set(traces.map(trace=>trace.id));
      state.traceSelection.ids=new Set([...state.traceSelection.ids].filter(traceId=>availableTraceIds.has(traceId)));
      state.lastSuccess=new Date();
      populateFilters();
      renderStats();
      const visibleTraces = matchingTraces();
      const selectedStillExists=state.selectedTraceId&&visibleTraces.some(trace=>trace.id===state.selectedTraceId);
      if (!selectedStillExists) {
        state.selectedTraceId=visibleTraces[0]?.id||null;
        state.selectedEventId=null;
        state.event=null;
        state.drawerOpen=false;
        state.pathResult=null;
        state.trace=null;
      }
      renderTraceList();
      if (state.selectedTraceId) {
        const traceOk=await loadTrace(state.selectedTraceId,{refreshEvent:!initial});
        if (!traceOk) return;
      } else {
        renderWorkspace();
      }
      const lastUpdateEl = $("#lastUpdate");
      if (lastUpdateEl) lastUpdateEl.textContent = `最后更新：${state.lastSuccess.toLocaleTimeString("zh-CN",{hour12:false})}`;
      setApiStatus("ok");
    } catch (error) {
      if (generation!==state.refreshGeneration) return;
      setApiStatus("error",friendlyError(error));
      if (!state.overview) {
        $("#traceList").innerHTML='<div class="empty">审计数据暂不可用</div>';
        renderTraceHeader();
        renderTimeline();
      }
    }
  }

  function copyText(value) {
    if (navigator.clipboard) navigator.clipboard.writeText(value).then(()=>toast("已复制"),()=>toast("复制失败"));
    else toast("浏览器不支持剪贴板 API");
  }
  let toastTimer=null;
  function toast(message) { const element=$("#toast");clearTimeout(toastTimer);element.textContent=message;element.classList.add("show");toastTimer=setTimeout(()=>element.classList.remove("show"),1800); }
  function exportTrace() {
    if (!state.trace) return;
    const blob=new Blob([JSON.stringify(state.trace.raw,null,2)],{type:"application/json"});
    const link=document.createElement("a");link.href=URL.createObjectURL(blob);link.download=`${state.trace.trace_id}-audit.json`;link.click();URL.revokeObjectURL(link.href);toast("已导出当前查询 Trace");
  }
  function closeDrawer() { state.drawerOpen=false;renderDrawer(); }

  function openRiskReview(node) {
    if (!node?.direct_risk_source || state.riskReview.submitting) return;
    state.riskReview.eventId=node.event_id;
    $("#riskReviewEventTitle").textContent=eventTitle(node);
    $("#riskReviewEventId").textContent=node.event_id;
    $("#riskReviewMask").classList.add("open");
    $("#riskReviewMask").setAttribute("aria-hidden","false");
    $("#confirmRiskReview").focus();
  }

  function closeRiskReview() {
    if (state.riskReview.submitting) return;
    state.riskReview.eventId=null;
    $("#riskReviewMask").classList.remove("open");
    $("#riskReviewMask").setAttribute("aria-hidden","true");
  }

  async function dismissReviewedRisk() {
    const eventId=state.riskReview.eventId;
    if (!eventId || state.riskReview.submitting) return;
    state.riskReview.submitting=true;
    const button=$("#confirmRiskReview");
    button.disabled=true;
    button.textContent="正在保存…";
    try {
      await requestJson(`/v1/audit/events/${encodeURIComponent(eventId)}/risk-review`,{
        method:"PUT",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({dismissed:true}),
      });
      const traceId=state.selectedTraceId;
      state.riskReview.submitting=false;
      state.riskReview.eventId=null;
      $("#riskReviewMask").classList.remove("open");
      $("#riskReviewMask").setAttribute("aria-hidden","true");
      if (traceId) state.traceCache.delete(traceId);
      await refreshAll();
      toast("已人工标记为无风险");
    } catch (error) {
      state.riskReview.submitting=false;
      toast(friendlyError(error,"风险复核保存失败"));
    } finally {
      button.disabled=false;
      button.textContent="标记为无风险";
    }
  }

  $("#navToggle")?.addEventListener("click",()=>$("#app").classList.toggle("nav-open"));
  $("#themeBtn")?.addEventListener("click",()=>{state.theme=state.theme==="light"?"dark":"light";document.body.classList.toggle("dark",state.theme==="dark");});
  $$('[data-view]').forEach(button=>button.addEventListener("click",()=>setViewMode(button.dataset.view)));
  $$('[data-nebula-path]').forEach(button=>button.addEventListener("click",()=>loadNebulaPath(button.dataset.nebulaPath)));
  $("#nebulaFitBtn")?.addEventListener("click",()=>state.nebula.instance?.fit());
  $("#nebulaResetBtn")?.addEventListener("click",()=>state.nebula.instance?.reset());
  $("#nebulaFullscreenBtn")?.addEventListener("click",toggleNebulaFullscreen);
  $("#notifyBtn")?.addEventListener("click",()=>refreshAll());
  $("#closeDrawer").addEventListener("click",closeDrawer);
  $("#drawerMask").addEventListener("click",closeDrawer);
  $("#cancelRiskReview").addEventListener("click",closeRiskReview);
  $("#confirmRiskReview").addEventListener("click",dismissReviewedRisk);
  $("#riskReviewMask").addEventListener("click",event=>{if(event.target===$("#riskReviewMask"))closeRiskReview();});
  document.addEventListener("click",event=>{if(!event.target.closest("[data-trace-popup],#tracePopover"))closeTracePopover();});
  document.addEventListener("fullscreenchange",syncNebulaFullscreen);
  document.addEventListener("keydown",event=>{if(event.key==="Escape"){closeRiskReview();if(state.drawerOpen)closeDrawer();closeTracePopover();if($("#nebulaShell").classList.contains("is-fullscreen")){ $("#nebulaShell").classList.remove("is-fullscreen");syncNebulaFullscreen(); }}});
  ["#globalSearch","#traceSearch"].forEach(selector=>$(selector).addEventListener("input",()=>{syncFilterState();renderTraceList();}));
  ["#sessionFilter","#riskFilter","#moduleFilter","#actionFilter","#riskOnly"].forEach(selector=>$(selector).addEventListener("change",()=>{syncFilterState();renderTraceList();}));
  $("#selectTraces").addEventListener("click",()=>setTraceSelection(true));
  $("#cancelTraceSelection").addEventListener("click",()=>setTraceSelection(false));
  $("#deleteTraces").addEventListener("click",deleteSelectedTraces);
  $$(".stat").forEach(card=>card.addEventListener("click",()=>{state.quick=state.quick===card.dataset.quick&&card.dataset.quick!=="all"?"all":card.dataset.quick;renderStats();renderTraceList();}));
  window.addEventListener("resize",()=>{closeTracePopover();scheduleNebulaResize();});
  window.addEventListener("beforeunload",()=>{if(nebulaResizeFrame)cancelAnimationFrame(nebulaResizeFrame);cancelNebulaViewTransition();destroyNebulaGraph();},{once:true});

  const urlParams = new URLSearchParams(window.location.search);
  const isEmbedded = urlParams.get('embedded') === '1' || window.self !== window.top;
  if (isEmbedded) {
    document.getElementById('app')?.classList.add('is-embedded');
  }
  const customTitle = urlParams.get('title');
  if (customTitle) {
    const titleEl = document.querySelector('.top-title');
    if (titleEl) {
      titleEl.innerHTML = `<strong class="product-wordmark">CLAWGUARD</strong><span class="product-context"><b>${escapeHtml(customTitle.toUpperCase())}</b><i aria-hidden="true">·</i><small>Agent Security Console</small></span>`;
    }
  }
  const moduleTitles = {
    content: "内容检测监测",
    content_guard: "内容检测监测",
    access: "访问控制监测",
    access_control: "访问控制监测",
    tools: "工具检测监测",
    tool_guard: "工具检测监测",
    sandbox: "沙箱安全监测",
    sandbox_mcp: "沙箱安全监测",
    audit: "审计概览",
  };
  const defaultModule = urlParams.get('module');
  if (defaultModule) {
    state.fixedModule = defaultModule;
    state.filters.module = defaultModule;
    const titleText = moduleTitles[defaultModule.toLowerCase()] || "模块监测";
    const headingH1 = $("#pageHeadingTitle") || document.querySelector(".page-heading h1");
    if (headingH1) headingH1.textContent = titleText;
    document.title = `${titleText} · Clawguard`;
  }

  $("#traceList").innerHTML='<div class="loading">正在加载真实审计任务…</div>';
  renderTraceHeader();
  renderTimeline();
  refreshAll({initial:true});
  window.setInterval(()=>refreshAll(),REFRESH_MS);
})();
</script>
</body>
</html>

    /* Visual refinement: quiet by default, explicit at risk. */
    :root {
      /* Clawguard brand - MiMo Code palette */

      --cg-border:#ece7e3; --cg-border-strong:#ddd7d0; --cg-text:#26251e; --cg-text-secondary:#706b64;
      --cg-text-muted:#8c8882; --cg-text-quiet:#aaa39c;
      /* Security semantics */
      --cg-success:#23804e; --cg-success-soft:#f4fbf6; --cg-success-border:#dfe9e2;
      --cg-warning:#ca5e14; --cg-warning-soft:#fff2e7; --cg-warning-border:#f4d7c0;
      --cg-danger:#e35d68; --cg-danger-soft:#fdf2f3; --cg-danger-border:#f7d2d6;
      --cg-impacted:#d97724; --cg-impacted-soft:#fff8f0; --cg-impacted-border:#f7dfc6;
      /* Shared trace language */
      --cg-trace-normal:#b8b2aa; --cg-trace-line:#ddd7d0; --cg-temporal:#c47120;
      --cg-module-1:#26251e; --cg-module-2:#4a473f; --cg-module-3:#6b665c; --cg-module-4:#8e877d; --cg-module-5:#b0a89d;
      --cg-nav-icon:#9e9891; --cg-nav-icon-active:#26251e;

      --bg:var(--cg-bg); --panel:var(--cg-surface); --panel-2:var(--cg-surface-subtle); --text:var(--cg-text);
      --muted:var(--cg-text-secondary); --metadata:var(--cg-text-muted); --quiet:var(--cg-text-quiet); --line:var(--cg-border);
      --nav:var(--cg-navy); --nav-2:color-mix(in srgb,var(--cg-primary) 12%,transparent);
      --brand:var(--cg-primary); --brand-strong:var(--cg-primary-hover); --brand-soft:var(--cg-primary-soft);
      --green:var(--cg-success); --green-bg:var(--cg-success-soft); --orange:var(--cg-warning); --orange-bg:var(--cg-warning-soft);
      --red:var(--cg-danger); --red-bg:var(--cg-danger-soft); --purple:#8f3fca; --purple-bg:#f1e9f7;

    body { font-size:13px; line-height:1.5; letter-spacing:-.002em; }

    .nav-item.active { background:var(--cg-primary-soft); color:var(--cg-text); box-shadow:inset 3px 0 0 var(--brand); }
    .shell { display:flex; flex-direction:column; height:100vh; overflow:hidden; }
    main { flex:1; min-height:0; overflow:auto; padding:18px 26px 28px; scrollbar-gutter:stable; }
    .page-heading { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:16px; }
    .page-heading-left { min-width:0; }

    .page-heading .search { width:360px; max-width:38vw; height:38px; border:1px solid var(--line); border-radius:8px; padding:0 12px; background:var(--panel); display:flex; align-items:center; gap:8px; box-shadow:0 1px 3px rgba(81,62,47,.035); transition:border-color var(--motion-fast),background var(--motion-fast),box-shadow var(--motion-fast); }
    .page-heading .search:focus-within { border-color:var(--brand); background:var(--panel); box-shadow:0 0 0 2px var(--brand-soft); }
    .page-heading .search svg { flex:none; color:var(--metadata); }
    .page-heading .search input { width:100%; border:0; color:var(--text); background:transparent; outline:0; font-size:13px; }
    h1 { font-size:28px; font-weight:700; line-height:1.2; letter-spacing:-.03em; margin:0; color:var(--text); }

    .stats { gap:14px; }
    .stat { min-height:92px; padding:12px 18px; border:1px solid var(--line); border-radius:12px; background:var(--panel); box-shadow:var(--shadow); transition:transform var(--motion-fast),box-shadow var(--motion-fast),background var(--motion-fast),border-color var(--motion-fast); }
    .stat::before { content:""; position:absolute; inset:0 auto 0 0; width:3px; background:transparent; border-radius:12px 0 0 12px; }
    .stat:hover { transform:translateY(-1px); border-color:#ddd7d0; background:var(--panel); box-shadow:var(--shadow-hover); }
    .stat.active { transform:none; border-color:var(--brand); background:var(--panel); box-shadow:0 0 0 1px var(--brand),var(--shadow); }
    .stat.active::before { background:var(--brand); }
    .stat.active::after { top:9px; right:11px; color:var(--muted); font-size:9px; letter-spacing:.05em; }
    .stat-top { font-size:12px; font-weight:600; color:var(--muted); }
    .stat-icon { width:28px; height:28px; border-radius:7px; color:var(--metadata); background:transparent; opacity:.82; }
    .stat-icon svg { width:17px; }
    .stat .num { display:block; margin:5px 0 1px; font-size:28px; font-weight:700; line-height:1.1; color:var(--text); letter-spacing:-.03em; }
    .stat-foot { font-size:12px; }
    .spark { right:9px; bottom:7px; color:var(--metadata); opacity:.60; }

    .charts { gap:12px; margin-top:12px; }
    .panel { border-color:var(--line); border-radius:11px; box-shadow:var(--shadow); }
    .chart { min-height:170px; padding:13px 18px 10px; }
    .panel-head h2,.panel-title,.trace-heading h2 { font-size:15px; font-weight:730; letter-spacing:-.01em; }
    canvas { height:112px; margin-top:4px; }
    .module-bars { gap:7px; margin-top:10px; }
    .module-row { color:var(--muted); line-height:1.2; }
    .module-row b { color:var(--text); }
    .bar { height:7px; background:#e5eaf1; }

    .module-row:nth-child(3) i { background:#6878b9; }
    .module-row:nth-child(4) i { background:#5b5fc7; }
    .module-row:nth-child(5) i { background:#3f73c9; }
    body.dark .bar { background:#2a384c; }
    body.dark .module-row:nth-child(1) i { background:#78a0ff; }
    body.dark .module-row:nth-child(2) i { background:#6791ef; }
    body.dark .module-row:nth-child(3) i { background:#8b92d4; }
    body.dark .module-row:nth-child(4) i { background:#8d8fe0; }
    body.dark .module-row:nth-child(5) i { background:#6f9ade; }

    .workspace { grid-template-columns:minmax(290px,320px) minmax(0,1fr); align-items:start; gap:14px; min-height:0; height:auto; margin-top:14px; }
    .workspace > .panel { border:1px solid var(--line); border-radius:14px; background:var(--panel); box-shadow:var(--shadow); }
    .trace-panel { grid-template-rows:auto auto auto; align-self:start; min-height:0; }
    .timeline-panel { grid-template-rows:auto auto; align-self:start; min-height:400px; }
    .panel-title { padding:15px 18px 11px; font-size:15px; font-weight:700; color:var(--text); }
    .filters { gap:7px; padding:0 14px 12px; border-bottom:1px solid var(--line); }
    .filters input,.filters select { border:1px solid #e9e4df; border-radius:8px; padding:7px 9px; background:#faf8f6; color:var(--text); }
    .filters input:focus,.filters select:focus { border-color:var(--brand); background:var(--panel); outline:none; box-shadow:0 0 0 2px var(--brand-soft); }
    .scroll { overflow:visible; padding:10px 12px; }
    .trace { min-height:98px; margin-bottom:9px; padding:11px 13px 11px 15px; border:1px solid #eeeae6; border-radius:10px; background:var(--panel-2); box-shadow:none; transition:all var(--motion-fast) ease; }
    .trace::before { width:3px; background:#ddd7d0; border-radius:10px 0 0 10px; }

    .trace:hover { transform:translateY(-1px); border-color:#ddd7d0; background:var(--panel); box-shadow:0 4px 14px rgba(81,62,47,.05); }

    .trace-title { font-size:13.5px; font-weight:680; }
    .trace-id { color:var(--metadata); font-size:11.5px; font-weight:600; }
    .trace-info-row { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:6px; }

    .trace-status.allow,.event-status.allow { color:var(--green); background:var(--green-bg); border:1px solid #dfe9e2; }
    .trace-status.block,.event-status.block { color:var(--red); background:var(--red-bg); border:1px solid #f7d2d6; }
    .trace-status.rewrite,.event-status.rewrite { color:var(--orange); background:var(--orange-bg); border:1px solid #f4d7c0; }
    .event-status.review { color:var(--purple); background:var(--purple-bg); border:1px solid #e5d5f2; }
    .trace-summary { display:flex; flex-wrap:wrap; gap:3px 12px; margin-top:5px; color:var(--metadata); font-size:11.5px; }
    .trace-summary .integrity-alert { color:var(--orange); font-weight:700; }

    .trace-header { align-items:flex-start; gap:14px; padding:15px 18px 13px; border-bottom:1px solid var(--line); }
    .trace-header-main { min-width:0; }
    .trace-heading { align-items:flex-start; gap:12px; }
    .trace-heading h2 { flex:none; padding-top:1px; font-size:15px; font-weight:700; color:var(--text); }
    .trace-label { display:grid; min-width:0; gap:1px; color:var(--text); }
    .trace-label > strong { overflow:hidden; font-size:14px; font-weight:680; text-overflow:ellipsis; white-space:nowrap; }
    .trace-label > span { overflow:hidden; color:var(--metadata); font-size:12px; text-overflow:ellipsis; white-space:nowrap; }
    .trace-label code { color:inherit; font:inherit; }
    .trace-metadata { gap:2px 10px; margin-top:9px; color:var(--metadata); font-size:11.5px; }
    .trace-summary-line { display:inline-flex; align-items:center; gap:5px; }
    .trace-summary-line strong { color:var(--text); font-weight:720; }
    .trace-summary-line i { color:color-mix(in srgb,var(--muted) 45%,transparent); font-style:normal; }
    .trace-summary-line .risk-value { color:var(--red); }
    .trace-time-range { color:var(--metadata); }
    .trace-mini-chain { margin-left:0; }
    .view-switch { display:inline-flex; border:1px solid #ebe7e3; border-radius:9px; padding:3px; background:#f5f3f1; }
    .view-tab { border:0; border-radius:6px; padding:5px 11px; color:#8c857e; background:transparent; font-size:12px; font-weight:600; cursor:pointer; transition:all var(--motion-fast) ease; }
    .view-tab:hover { color:#3b3834; }
    .view-tab.active { color:#3b3834; background:#fff; box-shadow:0 1px 4px rgba(45,36,29,.09); font-weight:700; }

    /* Unified Clawguard Trace Visual Language: node role and edge certainty are

    .trace-node {

      box-shadow:0 0 0 2px var(--cg-surface),0 0 0 3px var(--trace-node-role-ring),0 0 0 5px var(--trace-node-focus-ring)!important;
      transition:background-color var(--motion-fast) ease,border-color var(--motion-fast) ease,box-shadow var(--motion-fast) ease,filter var(--motion-fast) ease;
    }
    .trace-state--normal { --trace-node-fill:var(--cg-surface); --trace-node-stroke:var(--cg-trace-normal); --trace-node-interaction-ring:var(--cg-primary); }

    .trace-state--risk-source { --trace-node-fill:var(--cg-danger); --trace-node-stroke:var(--cg-danger); --trace-node-role-ring:var(--cg-danger); --trace-node-interaction-ring:var(--cg-danger); }
    .trace-state--impacted { --trace-node-fill:var(--cg-impacted); --trace-node-stroke:var(--cg-impacted); --trace-node-role-ring:var(--cg-impacted-border); --trace-node-interaction-ring:var(--cg-impacted); }

    .trace-state--selected { --trace-node-focus-ring:var(--trace-node-interaction-ring,var(--cg-primary)); }
    .trace-state--active { --trace-node-focus-ring:var(--trace-node-interaction-ring,var(--cg-primary-active)); animation:trace-node-active 1.55s ease-in-out infinite; }
    .trace-state--active:not(.trace-state--risk):not(.trace-state--risk-source):not(.trace-state--impacted) { --trace-node-fill:var(--cg-primary-active); --trace-node-stroke:var(--cg-primary-active); }

    .trace-state--blocked:not(.trace-state--risk):not(.trace-state--risk-source):not(.trace-state--impacted) { --trace-node-fill:var(--cg-surface); --trace-node-stroke:var(--cg-trace-normal); --trace-node-role-ring:transparent; }

    /* Fingerprint and header Mini Trace edges share the same certainty/replay states. */

    .finger-node.trace-edge--temporal:not(:last-child)::after { height:0!important; background:transparent!important; border-top:1.5px dashed var(--cg-temporal)!important; opacity:.7; }
    .finger-node.trace-edge--completed:not(:last-child)::after { background:var(--cg-primary)!important; opacity:.9; }
    .finger-node.trace-edge--active:not(:last-child)::after { background:linear-gradient(90deg,var(--cg-primary),var(--cg-primary-active),var(--cg-primary))!important; background-size:220% 100%!important; animation:trace-edge-flow 1.15s linear infinite; opacity:1; }
    .finger-node.trace-edge--risk-path:not(:last-child)::after { background:linear-gradient(90deg,var(--cg-danger),var(--cg-impacted))!important; opacity:1; }
    .finger-node.trace-edge--risk-path.trace-edge--active:not(:last-child)::after { background:linear-gradient(90deg,var(--cg-danger),var(--cg-impacted),var(--cg-danger))!important; background-size:220% 100%!important; }

        <article class="panel trace-panel"><div class="panel-title">Trace 任务 <span class="tiny" id="traceCount"></span></div><div class="filters"><input class="filter-wide" id="traceSearch" placeholder="搜索 Trace / Event / 任务名称"><select id="sessionFilter"><option value="">全部 Session</option></select><select id="riskFilter"><option value="">全部风险等级</option><option value="risk">有风险</option><option value="high">高风险 (≥ 0.8)</option><option value="low">低/中风险</option></select><select id="moduleFilter"><option value="">全部模块</option></select><select id="actionFilter"><option value="">全部动作</option><option value="allow">允许</option><option value="block">阻断</option><option value="rewrite">改写</option><option value="human_review">人工复核</option></select><div class="filter-actions"><label><input id="riskOnly" type="checkbox"> 只看风险任务</label><div class="trace-selection-actions"><button class="trace-selection-btn" id="selectTraces" type="button">选择</button><button class="trace-selection-btn danger" id="deleteTraces" type="button" hidden disabled>删除</button><button class="trace-selection-btn" id="cancelTraceSelection" type="button" hidden>取消</button></div></div></div><div class="scroll" id="traceList"></div></article>
        <article class="panel timeline-panel"><div class="trace-header"><div class="trace-header-main"><div class="trace-heading"><h2>工具调用链</h2><span class="trace-label" id="timelineTrace">选择一个 Trace 查看完整安全链路</span></div><div class="trace-metadata" id="traceMetadata"></div></div><div class="trace-header-actions"><div class="view-switch" role="tablist" aria-label="Trace 视图"><button class="view-tab active" id="timelineViewBtn" type="button" data-view="timeline" role="tab" aria-selected="true">工具调用链</button><button class="view-tab" id="nebulaViewBtn" type="button" data-view="nebula" role="tab" aria-selected="false">星云图</button></div></div></div><div class="timeline" id="timeline"></div><section class="nebula-shell" id="nebulaShell" aria-label="安全审计星云图" hidden><div class="nebula-toolbar"><div class="nebula-path-tabs" role="tablist" aria-label="星云关系范围"><button class="nebula-btn active" type="button" data-nebula-path="all" role="tab" aria-selected="true">全部关系</button><button class="nebula-btn" type="button" data-nebula-path="cause" role="tab" aria-selected="false">原因链</button><button class="nebula-btn" type="button" data-nebula-path="impact" role="tab" aria-selected="false">影响链</button></div><span class="nebula-context" id="nebulaContext">选择直接风险源后可查询原因链和影响链</span><div class="nebula-tools"><button class="nebula-btn" id="nebulaFitBtn" type="button">适应窗口</button><button class="nebula-btn" id="nebulaResetBtn" type="button">重置布局</button><button class="nebula-btn" id="nebulaFullscreenBtn" type="button" aria-pressed="false">全屏查看</button></div></div><div class="nebula-viewport" id="nebulaViewport" tabindex="0" aria-label="可拖动和缩放的审计星云画布"><svg class="nebula-graph" id="nebulaGraph" role="img" aria-labelledby="nebulaGraphTitle"><title id="nebulaGraphTitle">当前 Trace 的安全审计星云图</title><defs><linearGradient id="nebula-core-gradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#15398f"/><stop offset=".55" stop-color="#315efb"/><stop offset="1" stop-color="#0a8dad"/></linearGradient><filter id="nebula-node-glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="nebula-core-glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="nebula-danger-glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="nebula-edge-glow-danger" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="nebula-edge-glow-impact" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="nebula-arrow-confirmed" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 8 4 0 8Z" fill="var(--nebula-cyan)"/></marker><marker id="nebula-arrow-temporal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 8 4 0 8Z" fill="var(--nebula-temporal)"/></marker></defs><g class="nebula-scene" id="nebulaScene"><g id="nebulaHulls"></g><g id="nebulaEdges"></g><g id="nebulaNodes"></g></g></svg><div class="nebula-empty" id="nebulaEmpty"><div><strong>请选择一个 Trace</strong><span>星云图只显示现有 Audit API 返回的真实事件。</span></div></div><div class="nebula-tooltip" id="nebulaTooltip" role="tooltip"></div><div class="nebula-legend" aria-label="星云图图例"><span><i></i>明确关系</span><span><i class="temporal"></i>时序推断</span><span><em class="risk"></em>直接风险源 / 阻断</span><span><em class="affected"></em>受影响外环</span><span><em class="review"></em>人工审批</span><span><i class="cause"></i>原因链</span><span><i class="impact"></i>影响链</span></div></div></section></article>
      </section>
    </main>
  </div>
</div>
<div class="drawer-mask" id="drawerMask"></div><aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-hidden="true" aria-label="事件详情抽屉"><div class="drawer-head"><div><h2>事件详情</h2><p id="drawerSub">选择时间线中的事件</p></div><button class="icon-btn" id="closeDrawer" aria-label="关闭详情"><svg viewBox="0 0 24 24" width="18" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><div class="drawer-body" id="drawerBody"></div></aside><div class="trace-popover" id="tracePopover" role="dialog" aria-hidden="true"><strong id="tracePopoverTitle"></strong><p id="tracePopoverText"></p></div><div class="risk-review-mask" id="riskReviewMask" aria-hidden="true"><section class="risk-review-dialog" role="dialog" aria-modal="true" aria-labelledby="riskReviewTitle"><div class="risk-review-head"><h2 id="riskReviewTitle">取消风险标记</h2><p>该操作不会修改原始 action、risk_score 或 AuditEvent，只会把此事件从当前有效风险源中排除。</p></div><div class="risk-review-body"><div class="risk-review-event"><strong id="riskReviewEventTitle"></strong><code id="riskReviewEventId"></code></div></div><div class="risk-review-actions"><button class="btn" id="cancelRiskReview" type="button">取消</button><button class="btn primary" id="confirmRiskReview" type="button">标记为无风险</button></div></section></div><div class="toast" id="toast" role="status"></div>
<script>
(() => {
  "use strict";

  const REFRESH_MS = 5000;
  const PATH_QUERY = "max_depth=8&max_paths=10";
  const $ = selector => document.querySelector(selector);
  const $$ = selector => [...document.querySelectorAll(selector)];
  const escapeHtml = value => String(value ?? "").replace(
    /[&<>"']/g,
    character => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[character],
  );
  const shortId = value => {
    const text = String(value ?? "");
    return text.length > 15 ? `${text.slice(0, 9)}…${text.slice(-5)}` : text;
  };
  const shortTraceId = value => {
    const text = String(value ?? "");
    return text.length > 11 ? `${text.slice(0, 5)}…${text.slice(-4)}` : text;
  };
  const asObject = value => value && typeof value === "object" && !Array.isArray(value) ? value : {};
  const asArray = value => Array.isArray(value) ? value : [];
  const formatTime = value => {
    const parsed = new Date(value);
    return Number.isNaN(parsed.getTime()) ? String(value ?? "—") : parsed.toLocaleString("zh-CN", {hour12:false});
  };
  const compact = (value, limit=72) => {
    const text = String(value ?? "").replace(/\s+/g, " ").trim();
    return text.length > limit ? `${text.slice(0, limit - 1)}…` : text;
  };
  const number = value => Number.isFinite(Number(value)) ? Number(value) : 0;
  const actionText = {allow:"允许", block:"阻断", rewrite:"改写", human_review:"人工复核"};
  const actionShort = {allow:"ALLOW", block:"BLOCK", rewrite:"REWRITE", human_review:"REVIEW"};
  const stageText = {
    input:"输入事件", user_input:"用户输入", input_guard:"输入安全检查",
    tool_pre:"工具调用前检查", tool_call:"工具调用", tool_result:"工具执行结果",
    content:"内容安全检查", knowledge:"知识检索", planning:"任务规划",
    output:"输出事件", output_guard:"输出安全检查", final_output:"最终输出",
    audit:"审计记录", sandbox:"沙箱执行", error:"错误事件",
  };
  const moduleText = {
    openclaw:"OpenClaw", openclaw_adapter:"OpenClaw Adapter",
    access_control:"Access Control", tool_guard:"Tool Guard",
    retrieval_guard:"Retrieval Guard", io_guard:"IO Guard",
    "io_guard.context":"Context Guard", "io_guard.input":"Input Guard",
    "io_guard.output":"Output Guard", audit:"Audit",
  };

  const state = {
    overview:null,
    traces:[],
    trace:null,
    event:null,
    traceCache:new Map(),
    selectedTraceId:null,
    selectedEventId:null,
    fixedModule:null,
    filters:{q:"",session:"",risk:"",module:"",action:"",riskOnly:false},
    quick:"all",
    viewMode:"timeline",
    theme:"light",
    drawerOpen:false,
    expandedDetailKeys:new Set(),
    pathMode:"cause",
    pathResult:null,
    graph:{mode:"task",pathMode:"all",fit:false,hoveredNode:null,expandedByTrace:new Map()},
    nebula:{pathMode:"all",focusRiskId:null,instance:null,collapsedByTrace:new Map(),lastDisplayedTraceId:null},
    refreshGeneration:0,
    traceRequestToken:0,
    eventRequestToken:0,
    lastSuccess:null,
    traceSelection:{active:false,ids:new Set(),deleting:false},
    riskReview:{eventId:null,submitting:false},
  };

  async function requestJson(url, options={}) {
    const response = await fetch(url, {
      ...options,
      cache:"no-store",
      headers:{Accept:"application/json", ...(options.headers || {})},
    });
    const payload = await response.json().catch(() => ({}));
    if (!response.ok) {
      const detail = asObject(payload.detail);
      const error = new Error(detail.message || `请求失败（HTTP ${response.status}）`);
      error.code = detail.code || `http_${response.status}`;
      error.lineNumber = detail.line_number;
      throw error;
    }
    return payload;
  }

  function traceName(summary) {
    const userInput = compact(summary.user_input || "");
    return userInput || "未记录用户输入";
  }

  function adaptTraceSummary(apiTrace) {
    const source = asObject(apiTrace);
    const summary = {
      id:String(source.trace_id ?? ""),
      trace_id:String(source.trace_id ?? ""),
      session:String(source.session_id ?? ""),
      session_id:String(source.session_id ?? ""),
      user_id:String(source.user_id ?? ""),
      event_count:number(source.event_count),
      started_at:source.started_at ?? null,
      ended_at:source.ended_at ?? null,
      direct_risk_source_count:number(source.direct_risk_source_count),
      user_input:typeof source.user_input === "string" && source.user_input.trim() ? source.user_input.trim() : null,
      display_name:typeof source.display_name === "string" ? source.display_name : null,
      source_modules:asArray(source.source_modules).map(String),
      actions:asArray(source.actions).map(String),
      max_risk_score:number(source.max_risk_score),
      blocked_event_count:number(source.blocked_event_count),
      human_review_event_count:number(source.human_review_event_count),
      confirmed_edge_count:number(source.confirmed_edge_count),
      temporal_edge_count:number(source.temporal_edge_count),
      last_stage:String(source.last_stage ?? ""),
      last_action:String(source.last_action ?? ""),
    };
    summary.name = traceName(summary);
    const totalEdges = summary.confirmed_edge_count + summary.temporal_edge_count;
    summary.integrity = totalEdges ? summary.confirmed_edge_count / totalEdges : 1;
    return summary;
  }

  function adaptEventNode(apiNode) {
    const source = asObject(apiNode);
    const raw = asObject(source.raw_event);
    const event = {...raw, ...source};
    delete event.raw_event;
    event.node_id = String(source.node_id ?? event.event_id ?? "");
    event.event_id = String(event.event_id ?? event.node_id);
    event.trace_id = String(event.trace_id ?? "");
    event.session_id = String(event.session_id ?? "");
    event.user_id = String(event.user_id ?? "");
    event.timestamp = String(event.timestamp ?? "");
    event.stage = String(event.stage ?? "unknown");
    event.source_module = String(event.source_module ?? "unknown");
    event.action = String(event.action ?? "unknown");
    event.risk_score = number(event.risk_score);
    event.reason = String(event.reason ?? "");
    event.content = asObject(event.content);
    event.metadata = asObject(event.metadata);
    event.sequence = source.sequence ?? event.metadata.sequence ?? null;
    event.direct_risk_source = source.direct_risk_source === true;
    event.original_direct_risk_source = source.original_direct_risk_source === true;
    event.risk_review_status = source.risk_review_status === "dismissed" ? "dismissed" : null;
    event.impacted = false;
    event.possibly_impacted = false;
    return event;
  }

  function adaptEdge(apiEdge) {
    const source = asObject(apiEdge);
    const inferred = source.inference === "temporal_sequence";
    return {
      ...source,
      source:String(source.source ?? ""),
      target:String(source.target ?? ""),
      key:String(source.key ?? `${source.source ?? ""}->${source.target ?? ""}`),
      relation:String(source.relation ?? (inferred ? "PRECEDES" : "UNKNOWN")),
      inference:inferred ? "temporal_sequence" : (source.inference ?? null),
      confirmed:source.relation === "PARENT_OF" && !source.inference,
      temporal:inferred,
    };
  }

  function markImpacts(nodes, edges) {
    const byId = new Map(nodes.map(node => [node.event_id, node]));
    const outgoing = new Map();
    edges.forEach(edge => {
      if (!outgoing.has(edge.source)) outgoing.set(edge.source, []);
      outgoing.get(edge.source).push(edge);
    });
    const riskIds = nodes.filter(node => node.direct_risk_source).map(node => node.event_id);
    for (const riskId of riskIds) {
      const queue = [{id:riskId, temporal:false}];
      const visited = new Set([`${riskId}:false`]);
      while (queue.length) {
        const current = queue.shift();
        for (const edge of outgoing.get(current.id) || []) {
          const usedTemporal = current.temporal || !edge.confirmed;
          const key = `${edge.target}:${usedTemporal}`;
          if (visited.has(key)) continue;
          visited.add(key);
          const target = byId.get(edge.target);
          if (target && !target.direct_risk_source) {
            if (usedTemporal) target.possibly_impacted = true;
            else target.impacted = true;
          }
          queue.push({id:edge.target, temporal:usedTemporal});
        }
      }
    }
    nodes.forEach(node => {
      if (node.impacted) node.possibly_impacted = false;
    });
  }

  function adaptTraceDetail(apiTrace) {
    const source = asObject(apiTrace);
    const nodes = asArray(source.nodes).map(adaptEventNode);
    const edges = asArray(source.edges).map(adaptEdge);
    markImpacts(nodes, edges);
    return {
      ...source,
      trace_id:String(source.trace_id ?? ""),
      risk_threshold:number(source.risk_threshold),
      direct_risk_source_ids:asArray(source.direct_risk_source_ids).map(String),
      risk_event_count:number(source.risk_event_count),
      nodes,
      edges,
      raw:source,
    };
  }

  function adaptOverview(apiOverview) {
    const source = asObject(apiOverview);
    return {
      event_count:number(source.event_count), trace_count:number(source.trace_count),
      risk_trace_count:number(source.risk_trace_count),
      direct_risk_source_count:number(source.direct_risk_source_count),
      blocked_event_count:number(source.blocked_event_count),
      human_review_event_count:number(source.human_review_event_count),
      confirmed_edge_count:number(source.confirmed_edge_count),
      temporal_edge_count:number(source.temporal_edge_count),
      chain_integrity_rate:Math.max(0, Math.min(1, number(source.chain_integrity_rate))),
      risk_trend:asArray(source.risk_trend).map(item => ({bucket:String(item.bucket ?? ""),count:number(item.count)})),
      module_distribution:asArray(source.module_distribution).map(item => ({source_module:String(item.source_module ?? "unknown"),count:number(item.count)})),
      generated_at:String(source.generated_at ?? ""),
    };
  }

  function setApiStatus(kind, message) {
    const status = $("#apiStatus");
    if (status) {
      status.classList.toggle("error", kind === "error");
      status.classList.toggle("loading", kind === "loading");
    }
    const statusText = $("#apiStatusText");
    if (statusText) {
      statusText.textContent = kind === "ok" ? "LIVE DATA" : kind === "error" ? "ERROR" : "REFRESHING";
    }
    const banner = $("#apiError");
    if (banner) {
      if (kind === "error") {
        banner.textContent = message;
        banner.classList.add("show");
      } else {
        banner.textContent = "";
        banner.classList.remove("show");
      }
    }
  }

  function friendlyError(error, prefix="审计数据读取失败") {
    const line = error.lineNumber ? `（JSONL 第 ${error.lineNumber} 行）` : "";
    return `${prefix}：${error.message}${line}。已保留上一次成功数据。`;
  }

  function stageLabel(stage) {
    return stageText[stage] || String(stage || "unknown").replaceAll("_", " ");
  }
  function moduleLabel(module) { return moduleText[module] || String(module || "unknown"); }
  function actionLabel(action) { return actionText[action] || String(action || "unknown"); }
  function actionClass(action) { return action === "human_review" ? "review" : action; }
  function eventToolName(event) {
    const content = asObject(event.content);
    const args = asObject(content.arguments);
    const metadata = asObject(event.metadata);
    const candidates = [
      content.original_tool_name,
      content.tool_name,
      content.tool,
      args.original_tool_name,
      args.tool_name,
      args.tool,
      args.name,
      metadata.original_tool_name,
      metadata.tool_name,
    ];
    for (const value of candidates) {
      if (typeof value === "string" && value.trim()) return compact(value, 40);
    }
    return null;
  }
  function missingTraceInputNotice() {
    return "未记录用户输入。该 Trace 可能来自旧版上报或关联字段缺失";
  }
  function eventTitle(event) {
    return stageLabel(event.stage);
  }
  function displayOperation(event) {
    const content = asObject(event.content);
    const args = asObject(content.arguments);
    const sources = [content, args];
    const fields = [
      ["prompt","请求"],["message","消息"],["text","内容"],["query","检索"],
      ["command","命令"],["cmd","命令"],["path","文件"],["file_path","文件"],
      ["url","网址"],["endpoint","端点"],["tool_name","工具"],["original_tool_name","原始工具"],
    ];
    for (const [key,label] of fields) {
      for (const source of sources) {
        if (typeof source[key] === "string" && source[key].trim()) return `${label}：${compact(source[key], 92)}`;
      }
    }
    return "AuditEvent 未提供可概括的操作字段";
  }
  function orderedNodes(trace=state.trace) {
    return trace ? [...trace.nodes].sort((left,right) => {
      const leftSequence = Number.isInteger(left.sequence) ? left.sequence : Number.MAX_SAFE_INTEGER;
      const rightSequence = Number.isInteger(right.sequence) ? right.sequence : Number.MAX_SAFE_INTEGER;
      return leftSequence - rightSequence || left.timestamp.localeCompare(right.timestamp) || left.event_id.localeCompare(right.event_id);
    }) : [];
  }
  function selectedEventNode() {
    return state.trace?.nodes.find(node => node.event_id === state.selectedEventId) || null;
  }

  function populateFilters() {
    const session = $("#sessionFilter");
    const module = $("#moduleFilter");
    const selectedSession = state.filters.session;
    const selectedModule = state.filters.module;
    session.replaceChildren(new Option("全部 Session", ""));
    module.replaceChildren(new Option("全部模块", ""));
    [...new Set(state.traces.map(trace => trace.session).filter(Boolean))].sort().forEach(value => session.add(new Option(value, value)));
    [...new Set(state.traces.flatMap(trace => trace.source_modules))].sort().forEach(value => module.add(new Option(moduleLabel(value), value)));
    session.value = selectedSession;
    module.value = selectedModule;
  }

  function syncFilterState() {
    state.filters = {
      q:[$("#globalSearch").value, $("#traceSearch").value].join(" ").trim().toLowerCase(),
      session:$("#sessionFilter").value,
      risk:$("#riskFilter").value,
      module:$("#moduleFilter").value,
      action:$("#actionFilter").value,
      riskOnly:$("#riskOnly").checked,
    };
  }

  const moduleCategories = {
    content: ["io_guard", "io_guard.input", "io_guard.output", "io_guard.context", "retrieval_guard", "media_input"],
    content_guard: ["io_guard", "io_guard.input", "io_guard.output", "io_guard.context", "retrieval_guard", "media_input"],
    access: ["access_control"],
    access_control: ["access_control"],
    tools: ["tool_guard"],
    tool_guard: ["tool_guard"],
    sandbox: ["sandbox", "sandbox_mcp"],
    sandbox_mcp: ["sandbox", "sandbox_mcp"],
  };

  function matchesModuleFilter(sourceModules, targetModule) {
    if (!targetModule || targetModule === "audit" || targetModule === "all") return true;
    const cat = moduleCategories[targetModule.toLowerCase()];
    if (cat) {
      return sourceModules.some(mod => cat.includes(mod) || cat.some(prefix => mod.startsWith(prefix)));
    }
    return sourceModules.includes(targetModule);
  }

  function matchingTraces() {
    const filter = state.filters;
    return state.traces.filter(trace => {
      const cached = state.traceCache.get(trace.id);
      const eventText = cached ? cached.nodes.flatMap(node => [node.event_id,node.reason,node.stage,node.source_module,JSON.stringify(node.content)]) : [];
      const haystack = [trace.id,trace.name,trace.display_name,trace.session,trace.user_id,...eventText].join(" ").toLowerCase();
      if (filter.q && !haystack.includes(filter.q)) return false;
      if (filter.session && trace.session !== filter.session) return false;
      if (filter.module && !matchesModuleFilter(trace.source_modules, filter.module)) return false;
      if (filter.action && !trace.actions.includes(filter.action)) return false;
      const hasRisk = trace.direct_risk_source_count > 0;
      if ((filter.riskOnly || filter.risk === "risk") && !hasRisk) return false;
      if (filter.risk === "high" && !(hasRisk && trace.max_risk_score >= .8)) return false;
      if (filter.risk === "low" && !(hasRisk && trace.max_risk_score < .8)) return false;
      if (state.quick === "risk" && !hasRisk) return false;
      if (state.quick === "block" && !trace.blocked_event_count) return false;
      if (state.quick === "review" && !trace.human_review_event_count) return false;
      if (state.quick === "complete" && trace.temporal_edge_count > 0) return false;
      return true;
    });
  }

  function renderStats() {
    const overview = state.overview;
    if (!overview) return;
    $("#statEvents").textContent = overview.event_count;
    $("#statTraces").textContent = overview.trace_count;
    $("#statRisk").textContent = overview.risk_trace_count;
    $("#statRiskSources").textContent = overview.direct_risk_source_count;
    $("#statBlock").textContent = overview.blocked_event_count;
    $("#statReview").textContent = overview.human_review_event_count;
    $("#statReviewPending").textContent = overview.human_review_event_count;
    $$(".stat").forEach(card => {
      const active = state.quick === card.dataset.quick;
      card.classList.toggle("active", active);
      card.setAttribute("aria-pressed", String(active));
    });
  }

  function closeTracePopover() {
    const popover = $("#tracePopover");
    popover.classList.remove("open");
    popover.setAttribute("aria-hidden", "true");
    popover.dataset.openKey = "";
  }

  function openTracePopover(trigger) {
    const trace = state.traces.find(item => item.id === trigger.dataset.tracePopupId);
    if (!trace) return;
    const kind = trigger.dataset.tracePopup;
    const openKey = `${trace.id}:${kind}`;
    const popover = $("#tracePopover");
    if (popover.classList.contains("open") && popover.dataset.openKey === openKey) {
      closeTracePopover();
      return;
    }
    const title = kind === "id" ? "完整 Trace ID" : "完整用户输入";
    const text = kind === "id"
      ? trace.id
      : trace.user_input || missingTraceInputNotice();
    $("#tracePopoverTitle").textContent = title;
    $("#tracePopoverText").textContent = text;
    popover.dataset.openKey = openKey;
    popover.setAttribute("aria-hidden", "false");
    const anchor = trigger.getBoundingClientRect();
    const margin = 12;
    const width = popover.offsetWidth || 340;
    const height = popover.offsetHeight || 120;
    const left = Math.max(margin, Math.min(anchor.left, window.innerWidth - width - margin));
    const below = anchor.bottom + 8;
    const top = below + height <= window.innerHeight - margin ? below : Math.max(margin, anchor.top - height - 8);
    popover.style.left = `${Math.round(left)}px`;
    popover.style.top = `${Math.round(top)}px`;
    requestAnimationFrame(() => popover.classList.add("open"));
  }

  function renderTraceList() {
    const list = matchingTraces();
    $("#traceCount").textContent = `(${list.length} / ${state.traces.length})`;
    renderTraceSelectionActions();
    if (!list.length) {
      $("#traceList").innerHTML = `<div class="empty">${state.traces.length ? "没有符合当前筛选条件的 Trace" : "暂无审计任务"}</div>`;
      return;
    }
    $("#traceList").innerHTML = list.map(trace => {
      const blocked = trace.blocked_event_count > 0;
      const risky = trace.direct_risk_source_count > 0;
      const selected = trace.id === state.selectedTraceId;
      const deleteSelected = state.traceSelection.ids.has(trace.id);
      const status = blocked ? "BLOCK" : risky ? "RISK" : "ALLOW";
      const statusClass = blocked ? "block" : risky ? "rewrite" : "allow";
      const titleText = escapeHtml(compact(trace.name, 13));
      const idText = escapeHtml(shortTraceId(trace.id));
      const titleMarkup = selected && !state.traceSelection.active
        ? `<button class="trace-value-trigger trace-name" type="button" data-trace-popup="input" data-trace-popup-id="${escapeHtml(trace.id)}" aria-label="查看完整用户输入">${titleText}</button>`
        : `<span class="trace-name">${titleText}</span>`;
      const idMarkup = selected && !state.traceSelection.active
        ? `<button class="trace-value-trigger trace-id" type="button" data-trace-popup="id" data-trace-popup-id="${escapeHtml(trace.id)}" aria-label="查看完整 Trace ID"><b>Trace ID:</b>${idText}</button>`
        : `<span class="trace-id"><b>Trace ID:</b>${idText}</span>`;
      const selectionMarkup = state.traceSelection.active
        ? `<input class="trace-select-checkbox" type="checkbox" tabindex="-1" ${deleteSelected ? "checked" : ""} aria-label="选择删除 Trace ${escapeHtml(trace.name)}">`
        : "";
      return `<article class="trace ${selected ? "selected" : ""} ${blocked ? "block" : risky ? "risk" : ""} ${state.traceSelection.active ? "select-mode" : ""} ${deleteSelected ? "delete-selected" : ""}" data-trace="${escapeHtml(trace.id)}" tabindex="0" role="button" aria-label="${state.traceSelection.active ? "选择删除" : "查看"} Trace ${escapeHtml(trace.name)}">
        ${selectionMarkup}
        <div class="trace-title">${titleMarkup}${idMarkup}</div>
        <div class="trace-summary"><i class="trace-status ${statusClass}">${status}</i><span>${trace.event_count} Events</span><span>${trace.direct_risk_source_count} Sources</span><span class="trace-time">${escapeHtml(formatTime(trace.ended_at))}</span></div>
      </article>`;
    }).join("");
    $$('[data-trace]').forEach(card => {
      card.addEventListener("click", event => {
        if (state.traceSelection.active) {
          event.preventDefault();
          toggleTraceSelection(card.dataset.trace);
          return;
        }
        if (event.target.closest("[data-trace-popup]")) return;
        selectTrace(card.dataset.trace);
      });
      card.addEventListener("keydown", event => {
        if (event.target !== card || !["Enter", " "].includes(event.key)) return;
        event.preventDefault();
        if (state.traceSelection.active) {
          toggleTraceSelection(card.dataset.trace);
          return;
        }
        selectTrace(card.dataset.trace);
      });
    });
    $$('[data-trace-popup]').forEach(trigger => trigger.addEventListener("click", event => {
      event.stopPropagation();
      openTracePopover(trigger);
    }));
  }

  function renderTraceSelectionActions() {
    const active=state.traceSelection.active;
    const count=state.traceSelection.ids.size;
    $("#selectTraces").hidden=active;
    $("#deleteTraces").hidden=!active;
    $("#cancelTraceSelection").hidden=!active;
    $("#deleteTraces").disabled=!count||state.traceSelection.deleting;
    $("#deleteTraces").textContent=state.traceSelection.deleting ? "删除中…" : "删除";
  }

  function setTraceSelection(active) {
    state.traceSelection.active=active;
    state.traceSelection.ids.clear();
    state.traceSelection.deleting=false;
    closeTracePopover();
    renderTraceList();
  }

  function toggleTraceSelection(traceId) {
    if (!state.traceSelection.active || state.traceSelection.deleting) return;
    if (state.traceSelection.ids.has(traceId)) state.traceSelection.ids.delete(traceId);
    else state.traceSelection.ids.add(traceId);
    renderTraceList();
  }

  async function deleteSelectedTraces() {
    const traceIds=[...state.traceSelection.ids];
    if (!traceIds.length || state.traceSelection.deleting) {
      toast("请先选择要删除的 Trace");
      return;
    }
    if (!window.confirm(`确定删除选中的 ${traceIds.length} 个 Trace 及其全部审计事件吗？此操作无法撤销。`)) return;
    state.traceSelection.deleting=true;
    renderTraceSelectionActions();
    try {
      const result=await requestJson("/v1/audit/traces",{
        method:"DELETE",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({trace_ids:traceIds}),
      });
      traceIds.forEach(traceId=>state.traceCache.delete(traceId));
      if (traceIds.includes(state.selectedTraceId)) {
        state.selectedTraceId=null;
        state.selectedEventId=null;
        state.trace=null;
        state.event=null;
        state.drawerOpen=false;
        state.pathResult=null;
      }
      state.traceSelection.active=false;
      state.traceSelection.ids.clear();
      state.traceSelection.deleting=false;
      await refreshAll();
      toast(`已删除 ${number(result.deleted_trace_count)} 个 Trace，共 ${number(result.deleted_event_count)} 条审计事件`);
    } catch (error) {
      state.traceSelection.deleting=false;
      renderTraceSelectionActions();
      toast(friendlyError(error,"删除失败"));
    }
  }

  function incomingRelation(node) {
    const edges = state.trace?.edges.filter(edge => edge.target === node.event_id) || [];
    if (!edges.length) return {label:"Trace root", temporal:false};
    if (edges.some(edge => edge.confirmed)) return {label:"明确 parent_event_id", temporal:false};
    if (edges.some(edge => edge.temporal)) return {label:"时序推断，非确定因果", temporal:true};
    return {label:edges.map(edge => edge.relation).join(", "), temporal:false};
  }

  function timelineToolCallId(node) {
    const metadataValue = asObject(node.metadata).tool_call_id;
    if (typeof metadataValue === "string" && metadataValue.trim()) return metadataValue.trim();
    const contentValue = asObject(node.content).tool_call_id;
    return typeof contentValue === "string" && contentValue.trim() ? contentValue.trim() : null;
  }

  function isTimelineInput(node) {
    return node.stage === "input" || node.source_module === "io_guard.input";
  }

  function isTimelineOutput(node) {
    return node.stage === "output" || node.source_module === "io_guard.output";
  }

  function timelineGroupRank(group) {
    if (group.kind === "input") return 0;
    if (group.kind === "output") return 2;
    return 1;
  }

  function groupTimelineNodes(nodes) {
    const groups = [];
    const toolGroups = new Map();
    nodes.forEach((node,index) => {
      const item = {node,index};
      if (isTimelineInput(node)) {
        groups.push({kind:"input", key:`input:${node.event_id}`, items:[item], order:index});
        return;
      }
      if (isTimelineOutput(node)) {
        groups.push({kind:"output", key:`output:${node.event_id}`, items:[item], order:index});
        return;
      }
      const toolCallId = timelineToolCallId(node);
      if (!toolCallId) {
        groups.push({kind:"fallback", key:`fallback:${node.event_id}`, toolCallId:null, items:[item], order:index});
        return;
      }
      if (!toolGroups.has(toolCallId)) {
        const group = {kind:"tool", key:`tool:${toolCallId}`, toolCallId, items:[], order:index};
        toolGroups.set(toolCallId,group);
        groups.push(group);
      }
      toolGroups.get(toolCallId).items.push(item);
    });
    return groups.sort((left,right) => timelineGroupRank(left) - timelineGroupRank(right) || left.order - right.order);
  }

  function timelineGroupHasTemporalRelation(group) {
    const eventIds = new Set(group.items.map(({node}) => node.event_id));
    return asArray(state.trace?.edges).some(edge =>
      eventIds.has(edge.target) &&
      (edge.temporal || edge.inference === "temporal_sequence")
    );
  }

  function timelineStepLabel(node) {
    const labels = {
      access_control:"权限检查",
      tool_guard:"工具意图检查",
      retrieval_guard:"检索内容检查",
      "io_guard.context":"上下文安全检查",
      "io_guard.input":"输入安全检查",
      "io_guard.output":"输出安全检查",
    };
    return labels[node.source_module] || moduleLabel(node.source_module);
  }

  function timelineGroupToolName(group) {
    for (const {node} of group.items) {
      const name = eventToolName(node);
      if (name) return name;
    }
    return "未知工具";
  }

  function timelineOperationSummary(group) {
    const fields = [
      ["query","检索内容"], ["url","URL / Endpoint"], ["endpoint","URL / Endpoint"],
      ["path","文件路径"], ["file_path","文件路径"], ["command","命令"],
      ["cmd","命令"], ["message","消息"], ["text","内容"],
    ];
    for (const [key,label] of fields) {
      for (const {node} of group.items) {
        const content = asObject(node.content);
        const args = asObject(content.arguments);
        for (const source of [args,content]) {
          if (typeof source[key] === "string" && source[key].trim()) {
            return {label,value:compact(source[key],140)};
          }
        }
      }
    }
    return {label:"操作内容",value:"未提供可概括的操作内容"};
  }

  function timelineGroupAction(group) {
    const actions = new Set(group.items.map(({node}) => node.action));
    return ["block","human_review","rewrite","allow"].find(action => actions.has(action)) || "unknown";
  }

  function timelineGroupRisk(group) {
    return Math.max(0,...group.items.map(({node}) => number(node.risk_score)));
  }

  function timelineGroupFlags(group) {
    return {
      direct:group.items.some(({node}) => node.direct_risk_source),
      impacted:group.items.some(({node}) => node.impacted),
      possible:group.items.some(({node}) => node.possibly_impacted),
    };
  }

  function buildTaskFlowProjection(trace) {
    const nodes = orderedNodes(trace);
    const groups = [];
    const toolGroups = new Map();
    const eventToGroup = new Map();
    let inputGroup = null;
    let outputGroup = null;

    const register = (group,item) => {
      group.items.push(item);
      group.order = Math.min(group.order,item.index);
      eventToGroup.set(item.node.event_id,group.key);
    };
    nodes.forEach((node,index) => {
      const item = {node,index};
      let group;
      if (isTimelineInput(node)) {
        if (!inputGroup) {
          inputGroup = {kind:"input",key:"flow:input",toolCallId:null,items:[],order:index};
          groups.push(inputGroup);
        }
        group = inputGroup;
      } else if (isTimelineOutput(node)) {
        if (!outputGroup) {
          outputGroup = {kind:"output",key:"flow:output",toolCallId:null,items:[],order:index};
          groups.push(outputGroup);
        }
        group = outputGroup;
      } else {
        const toolCallId = timelineToolCallId(node);
        if (toolCallId) {
          if (!toolGroups.has(toolCallId)) {
            const toolGroup = {kind:"tool",key:`flow:tool:${toolCallId}`,toolCallId,items:[],order:index};
            toolGroups.set(toolCallId,toolGroup);
            groups.push(toolGroup);
          }
          group = toolGroups.get(toolCallId);
        } else {
          group = {kind:"fallback",key:`flow:fallback:${node.event_id}`,toolCallId:null,items:[],order:index};
          groups.push(group);
        }
      }
      register(group,item);
    });

    groups.sort((left,right) => timelineGroupRank(left) - timelineGroupRank(right) || left.order - right.order || left.key.localeCompare(right.key));
    let toolNumber = 0;
    groups.forEach(group => {
      if (group.kind === "tool") toolNumber += 1;
      const operation = timelineOperationSummary(group);
      const flags = timelineGroupFlags(group);
      Object.assign(group,{
        toolNumber:group.kind === "tool" ? toolNumber : 0,
        toolName:group.kind === "tool" ? timelineGroupToolName(group) : null,
        title:group.kind === "input" ? "任务输入" : group.kind === "output" ? "最终输出" : group.kind === "tool" ? `工具调用 ${toolNumber} · ${timelineGroupToolName(group)}` : "未关联工具调用",
        operation,
        action:timelineGroupAction(group),
        risk:timelineGroupRisk(group),
        directRiskSource:flags.direct,
        impacted:flags.impacted,
        possiblyImpacted:flags.possible,
      });
    });

    const groupedEdges = new Map();
    asArray(trace?.edges).forEach((edge,index) => {
      const source = eventToGroup.get(edge.source);
      const target = eventToGroup.get(edge.target);
      if (!source || !target || source === target) return;
      const pairKey = `${source}=>${target}`;
      if (!groupedEdges.has(pairKey)) {
        groupedEdges.set(pairKey,{
          key:`flow-edge:${pairKey}`,
          source,
          target,
          edgeKeys:[],
          relations:[],
          confirmed:false,
          hasTemporal:false,
          order:index,
        });
      }
      const projected = groupedEdges.get(pairKey);
      projected.edgeKeys.push(String(edge.key ?? `${edge.source}:${edge.target}:${index}`));
      if (edge.relation) projected.relations.push(String(edge.relation));
      projected.confirmed ||= Boolean(edge.confirmed);
      projected.hasTemporal ||= Boolean(edge.temporal || edge.inference === "temporal_sequence");
    });
    const edges = [...groupedEdges.values()].map(edge => ({
      ...edge,
      temporal:!edge.confirmed && edge.hasTemporal,
      relation:edge.confirmed ? "明确事件关系" : edge.hasTemporal ? "时序推断，非确定因果" : [...new Set(edge.relations)].join(", ") || "事件关系",
    })).sort((left,right) => left.order - right.order || left.key.localeCompare(right.key));
    return {groups,edges,eventToGroup};
  }

  function taskFlowExpandedSet(traceId=state.trace?.trace_id) {
    const key=String(traceId || "");
    if (!state.graph.expandedByTrace.has(key)) {
      state.graph.expandedByTrace.set(key,new Set());
    }
    return state.graph.expandedByTrace.get(key);
  }

  function taskFlowLayout(projection) {
    const groups=projection.groups;
    const byKey=new Map(groups.map(group => [group.key,group]));
    const order=new Map(groups.map((group,index) => [group.key,index]));
    const hasInput=groups.some(group => group.kind === "input");
    const depth=new Map(groups.map(group => [group.key,group.kind === "input" ? 0 : hasInput ? 1 : 0]));
    for (let pass=0;pass<groups.length;pass+=1) {
      let changed=false;
      projection.edges.filter(edge => !edge.temporal).forEach(edge => {
        if (!byKey.has(edge.source) || !byKey.has(edge.target)) return;
        if ((order.get(edge.source) || 0) >= (order.get(edge.target) || 0)) return;
        if (byKey.get(edge.target).kind === "input") return;
        const next=Math.max(depth.get(edge.target) || 0,(depth.get(edge.source) || 0)+1);
        if (next!==depth.get(edge.target)) { depth.set(edge.target,next);changed=true; }
      });
      if (!changed) break;
    }
    groups.filter(group => group.kind === "input").forEach(group => depth.set(group.key,0));
    const nonOutputGroups=groups.filter(group => group.kind !== "output");
    const nonOutputMax=Math.max(0,...nonOutputGroups.map(group => depth.get(group.key) || 0));
    groups.filter(group => group.kind === "output").forEach(group => depth.set(group.key,nonOutputGroups.length ? nonOutputMax+1 : 0));
    const layers=new Map();
    groups.forEach(group => {
      const layer=depth.get(group.key) || 0;
      if (!layers.has(layer)) layers.set(layer,[]);
      layers.get(layer).push(group);
    });
    layers.forEach(layer => layer.sort((left,right) => (order.get(left.key) || 0)-(order.get(right.key) || 0)));
    const expanded=taskFlowExpandedSet();
    const width=330,gapX=82,gapY=34,padX=34,padY=50;
    const positions=new Map();
    let contentHeight=0;
    [...layers.entries()].sort((a,b)=>a[0]-b[0]).forEach(([layer,layerGroups]) => {
      const heights=layerGroups.map(group => {
        const isExpanded=expanded.has(group.key);
        return isExpanded ? 150+group.items.length*96 : 122;
      });
      const layerHeight=heights.reduce((sum,height)=>sum+height,0)+Math.max(0,heights.length-1)*gapY;
      contentHeight=Math.max(contentHeight,layerHeight);
      let y=padY;
      layerGroups.forEach((group,index) => {
        positions.set(group.key,{x:padX+layer*(width+gapX),y,width,height:heights[index],layer});
        y+=heights[index]+gapY;
      });
    });
    const layoutWidth=Math.max(620,padX*2+(Math.max(0,...depth.values())+1)*width+Math.max(0,Math.max(0,...depth.values()))*gapX);
    const layoutHeight=Math.max(420,padY*2+contentHeight);
    return {positions,width:layoutWidth,height:layoutHeight};
  }

  function taskFlowEdgePath(from,to) {
    const forward=to.x>=from.x;
    const x1=forward?from.x+from.width:from.x;
    const y1=from.y+Math.min(58,from.height/2);
    const x2=forward?to.x:to.x+to.width;
    const y2=to.y+Math.min(58,to.height/2);
    if (forward) {
      const mid=x1+(x2-x1)/2;
      return `M ${x1} ${y1} C ${mid} ${y1}, ${mid} ${y2}, ${x2} ${y2}`;
    }
    const lift=Math.max(34,Math.abs(x1-x2)*.08);
    return `M ${x1} ${y1} C ${x1-lift} ${y1-lift}, ${x2+lift} ${y2-lift}, ${x2} ${y2}`;
  }

  function taskFlowSemanticClasses(item) {
    const node=item.node || item;
    return [
      node.direct_risk_source ? "risk-source" : "",
      node.impacted ? "impacted" : "",
      node.possibly_impacted ? "possibly-impacted" : "",
      node.action === "block" ? "blocked" : "",
    ].filter(Boolean).join(" ");
  }

  function renderTaskFlowStep(item,index) {
    const node=item.node;
    const selected=node.event_id===state.selectedEventId;
    const action=actionShort[node.action] || String(node.action || "UNKNOWN").toUpperCase();
    return `<button class="task-flow-step ${taskFlowSemanticClasses(item)} ${selected?"selected":""}" type="button" data-task-step="${escapeHtml(node.event_id)}" title="查看事件 ${escapeHtml(node.event_id)}"><span class="task-flow-step-title">步骤 ${index+1} · ${escapeHtml(timelineStepLabel(node))} · ${escapeHtml(action)}</span><span class="task-flow-step-risk">Risk ${number(node.risk_score).toFixed(2)}</span><span class="task-flow-step-reason">${escapeHtml(node.reason || "未提供说明")}</span><span class="task-flow-step-id">${escapeHtml(compact(node.event_id,42))}</span></button>`;
  }

  function renderTaskFlowGroup(group,pos,highlighted) {
    const expanded=taskFlowExpandedSet().has(group.key);
    const selected=group.items.some(({node}) => node.event_id===state.selectedEventId);
    const active=highlighted?.nodes && group.items.some(({node}) => highlighted.nodes.has(node.event_id));
    const faded=Boolean(highlighted) && !active;
    const semantic=[
      group.directRiskSource?"is-risk-source":"",
      group.impacted?"is-impacted":"",
      group.possiblyImpacted?"is-possibly-impacted":"",
      group.action==="block"?"is-blocked":"",
      selected?"is-selected":"",
      expanded?"expanded":"",
    ].filter(Boolean).join(" ");
    const flag=group.directRiskSource?'<span class="risk-tag direct">直接风险源</span>':group.impacted?'<span class="risk-tag impacted">已受影响</span>':group.possiblyImpacted?'<span class="risk-tag impacted">可能受影响</span>':"";
    const toolId=group.toolCallId?`<span>调用 ID <strong title="${escapeHtml(group.toolCallId)}">${escapeHtml(compact(group.toolCallId,30))}</strong></span>`:group.kind==="fallback"?'<span class="infer temporal">缺少 tool_call_id，采用 fallback 关联</span>':"";
    const headContent=`<span class="task-flow-headline"><span class="task-flow-chevron" aria-hidden="true">▶</span><strong title="${escapeHtml(group.title)}">${escapeHtml(group.title)}</strong><span class="event-status ${actionClass(group.action)}">${escapeHtml(actionShort[group.action] || String(group.action || "UNKNOWN").toUpperCase())}</span></span><span class="task-flow-operation"><b>${escapeHtml(group.operation.label)}：</b>${escapeHtml(group.operation.value)}</span><span class="task-flow-meta"><span>Risk <strong>${group.risk.toFixed(2)}</strong></span><span><strong>${group.items.length}</strong> 个事件</span>${toolId}${flag}</span>`;
    const head=`<button class="task-flow-head" type="button" data-task-group="${escapeHtml(group.key)}" aria-expanded="${String(expanded)}">${headContent}</button>`;
    const steps=expanded?`<div class="task-flow-steps">${group.items.map(renderTaskFlowStep).join("")}</div>`:"";
    return `<g class="task-flow-group ${faded?"is-faded":""}" data-task-flow-group="${escapeHtml(group.key)}" transform="translate(${pos.x} ${pos.y})"><foreignObject width="${pos.width}" height="${pos.height}"><div xmlns="http://www.w3.org/1999/xhtml" class="task-flow-card ${semantic}">${head}${steps}</div></foreignObject></g>`;
  }

  function renderTaskFlowGraph() {
    const svg=$("#traceGraph");
    const empty=$("#graphEmpty");
    const wrap=$("#graphViewportWrap");
    const projection=buildTaskFlowProjection(state.trace);
    if (!projection.groups.length) {
      svg.hidden=true;
      empty.hidden=false;
      return;
    }
    const model=taskFlowLayout(projection);
    const highlighted=pathSets();
    const availableWidth=Math.max(620,Math.floor((wrap?.clientWidth || 960)-2));
    const availableHeight=Math.max(420,Math.floor((wrap?.clientHeight || 560)-2));
    const scale=state.graph.fit?Math.min(1,availableWidth/model.width,availableHeight/model.height):1;
    svg.hidden=false;
    empty.hidden=true;
    svg.setAttribute("aria-label","Trace 任务流程图");
    svg.setAttribute("viewBox",`0 0 ${model.width} ${model.height}`);
    svg.setAttribute("width",model.width);
    svg.setAttribute("height",model.height);
    svg.setAttribute("preserveAspectRatio","xMinYMin meet");

    svg.style.height=`${Math.round(model.height*scale)}px`;
    $("#graphEdges").innerHTML=projection.edges.filter(edge => edge.confirmed).map(edge => {
      const from=model.positions.get(edge.source),to=model.positions.get(edge.target);
      if (!from || !to || to.x<=from.x) return "";
      const active=highlighted?.edges && edge.edgeKeys.some(key => highlighted.edges.has(key));
      const faded=Boolean(highlighted)&&!active;
      const d=taskFlowEdgePath(from,to);
      return `<path class="task-flow-edge direct ${active?"is-highlighted":""} ${faded?"is-faded":""}" data-task-flow-edge="${escapeHtml(edge.key)}" d="${d}" marker-end="url(#arrow-direct)"><title>${escapeHtml(edge.relation)}</title></path>`;
    }).join("");
    $("#graphNodes").innerHTML=projection.groups.map(group => renderTaskFlowGroup(group,model.positions.get(group.key),highlighted)).join("");
    $$('[data-task-group]').forEach(button => button.addEventListener("click",() => {
      const expanded=taskFlowExpandedSet();
      if (expanded.has(button.dataset.taskGroup)) expanded.delete(button.dataset.taskGroup);
      else expanded.add(button.dataset.taskGroup);
      renderTaskFlowGraph();
    }));
    $$('[data-task-step]').forEach(button => button.addEventListener("click",() => selectEvent(button.dataset.taskStep)));
  }

  function timelineReason(reason) {
    const text = String(reason || "").trim();
    if (!text) return "未记录判定说明";
    if (text === "no risk detected") return "未检测到风险";
    if (text === "skip_empty_or_error") return "内容为空或工具返回错误，未执行内容检测";
    if (text.startsWith("allow:")) return `允许：${text.slice(6).trim()}`;
    if (text.startsWith("block:")) return `阻断：${text.slice(6).trim()}`;
    return compact(text,220);
  }

  function timelineFlagsMarkup(node, relation) {
    return [
      node.direct_risk_source ? '<span class="tag block">直接风险源</span>' : "",
      node.risk_review_status === "dismissed" ? '<span class="tag risk-dismissed">已人工标记无风险</span>' : "",
      node.impacted ? '<span class="tag impacted-tag">已受影响</span>' : "",
      node.possibly_impacted ? '<span class="tag infer">可能受影响</span>' : "",
      relation.temporal ? '<span class="tag infer">时序推断，不代表确定因果</span>' : "",
    ].join("");
  }

  function renderTimelineStep(item,stepNumber) {
    const {node} = item;
    const relation = incomingRelation(node);
    const title = timelineStepLabel(node);
    const dismissed = node.risk_review_status === "dismissed";

        <span class="timeline-step-heading"><strong>步骤 ${stepNumber} · ${escapeHtml(title)}</strong><time datetime="${escapeHtml(node.timestamp)}">${escapeHtml(formatTime(node.timestamp))}</time></span>
        <span class="timeline-step-facts"><span><b>模块</b>${escapeHtml(moduleLabel(node.source_module))}</span><span class="timeline-step-status"><i class="event-status ${escapeHtml(actionClass(node.action))}">${escapeHtml(actionShort[node.action] || node.action.toUpperCase())}</i></span><span><b>Risk</b><strong class="${node.direct_risk_source ? "risk-value" : ""}">${node.risk_score.toFixed(2)}</strong></span></span>
        <span class="timeline-step-reason"><b>说明</b>${escapeHtml(timelineReason(node.reason))}</span>
        <span class="timeline-step-footer"><code title="${escapeHtml(node.event_id)}">事件 ID：${escapeHtml(shortId(node.event_id))}</code><span>${timelineFlagsMarkup(node,relation)}</span></span>

  function renderTimelineGroup(group,toolNumber) {
    const action = timelineGroupAction(group);

      flags.direct ? '<span class="tag block">直接风险源</span>' : "",

    } else if (group.kind === "input") {
      heading = '<div class="timeline-group-title"><span>任务输入</span></div><div class="timeline-group-detail"><span>Trace 的输入阶段</span></div>';

    } else {

        : "";
      heading = `<div class="timeline-group-title"><span>未关联工具调用</span></div><div class="timeline-group-detail"><span class="fallback-note">缺少工具调用关联信息（可能来自旧版上报）</span>${temporalNotice}</div>`;
    }
    return `<section class="timeline-group ${escapeHtml(group.kind)} ${flags.direct ? "has-risk" : ""} ${flags.impacted || flags.possible ? "has-impact" : ""}" data-timeline-group="${escapeHtml(group.key)}">
      <header class="timeline-group-head"><div class="timeline-group-copy">${heading}</div><div class="timeline-group-state"><i class="event-status ${escapeHtml(actionClass(action))}">${escapeHtml(actionShort[action] || action.toUpperCase())}</i><strong class="${flags.direct ? "risk-value" : ""}">Risk ${risk.toFixed(2)}</strong>${groupFlags}</div></header>
      <div class="timeline-group-steps">${group.items.map((item,index) => renderTimelineStep(item,index+1)).join("")}</div>

  function renderTraceHeader() {

  function renderTimeline() {
    const root = $("#timeline");
    if (!state.trace) {
      root.innerHTML = `<div class="empty">${state.traces.length ? "请选择一个 Trace" : "暂无审计任务"}</div>`;

  function graphModel(availableWidth,compactLayout=false) {
    const nodes = orderedNodes();
    const edges = state.trace?.edges || [];
    const byId = new Map(nodes.map(node => [node.event_id,node]));
    const order = new Map(nodes.map((node,index) => [node.event_id,index]));
    const depth = new Map(nodes.map(node => [node.event_id,0]));
    for (let pass=0; pass<nodes.length; pass += 1) {
      let changed = false;
      edges.forEach(edge => {
        if (!byId.has(edge.source) || !byId.has(edge.target)) return;
        const next = Math.max(depth.get(edge.target) || 0, (depth.get(edge.source) || 0) + 1);
        if (next !== depth.get(edge.target)) { depth.set(edge.target,next); changed=true; }
      });
      if (!changed) break;
    }
    const layoutNodes=[...nodes].sort((left,right) =>
      (depth.get(left.event_id) || 0) - (depth.get(right.event_id) || 0)
      || (order.get(left.event_id) || 0) - (order.get(right.event_id) || 0)
    );
    const width=Math.max(620,Math.floor(availableWidth || 960));
    const padX=28,padY=58,nodeH=86;
    const preferredNodeW=compactLayout ? 190 : 214;
    const gapX=compactLayout ? 42 : 54;
    const gapY=64;
    const nodeW=Math.min(preferredNodeW,Math.max(172,width-padX*2));
    const columns=Math.max(1,Math.min(layoutNodes.length || 1,Math.floor((width-padX*2+gapX)/(nodeW+gapX))));
    const rowCount=Math.max(1,Math.ceil(layoutNodes.length/columns));
    const contentHeight=rowCount*nodeH+(rowCount-1)*gapY;
    const height=Math.max(420,padY*2+contentHeight);
    const startY=Math.max(padY,(height-contentHeight)/2);
    const positions=new Map();
    for (let row=0; row<rowCount; row += 1) {
      const rowNodes=layoutNodes.slice(row*columns,(row+1)*columns);
      const rowWidth=rowNodes.length*nodeW+Math.max(0,rowNodes.length-1)*gapX;
      const startX=Math.max(padX,(width-rowWidth)/2);
      rowNodes.forEach((node,index) => {
        const visualColumn=row%2===0 ? index : rowNodes.length-1-index;
        positions.set(node.event_id,{
          x:startX+visualColumn*(nodeW+gapX),
          y:startY+row*(nodeH+gapY),
          width:nodeW,
          height:nodeH,
          row,
        });
      });
    }
    return {nodes,edges,byId,positions,width,height,columns,rowCount};
  }

  function graphEdgePath(from,to) {
    const sameRow=from.row===to.row;
    if (sameRow) {
      const forward=to.x>=from.x;
      const x1=forward ? from.x+from.width : from.x;
      const x2=forward ? to.x : to.x+to.width;
      const y1=from.y+from.height/2;
      const y2=to.y+to.height/2;
      const mid=x1+(x2-x1)/2;
      return `M ${x1} ${y1} C ${mid} ${y1}, ${mid} ${y2}, ${x2} ${y2}`;
    }
    const downward=to.y>from.y;
    const x1=from.x+from.width/2;
    const x2=to.x+to.width/2;
    const y1=downward ? from.y+from.height : from.y;
    const y2=downward ? to.y : to.y+to.height;
    const mid=y1+(y2-y1)/2;
    return `M ${x1} ${y1} C ${x1} ${mid}, ${x2} ${mid}, ${x2} ${y2}`;
  }

  function pathSets() {
    if (!state.pathResult || state.graph.pathMode === "all") return null;
    const paths=asArray(state.pathResult.paths);
    const pathNodes=[...asArray(state.pathResult.nodes),...paths.flatMap(path => asArray(path.nodes))];
    const pathEdges=[...asArray(state.pathResult.edges),...paths.flatMap(path => asArray(path.edges))];
    return {
      nodes:new Set(pathNodes.map(node => typeof node === "string" ? node : String(node.node_id ?? node.event_id))),
      edges:new Set(pathEdges.map(edge => String(edge.key))),
    };
  }

  function nebulaCollapsedSet(traceId=state.trace?.trace_id) {
    const key=String(traceId || "");
    if (!state.nebula.collapsedByTrace.has(key)) state.nebula.collapsedByTrace.set(key,new Set());
    return state.nebula.collapsedByTrace.get(key);
  }

  function nebulaStableNumber(value) {
    let hash=2166136261;
    for (const character of String(value || "")) {
      hash^=character.charCodeAt(0);
      hash=Math.imul(hash,16777619);
    }
    return (hash>>>0)/4294967295;
  }

  function extractNebulaResources(event) {
    const resources=[];
    const seen=new Set();
    const fileKeys=new Set(["file","file_path","filepath","path","filename"]);
    const urlKeys=new Set(["url","uri","endpoint"]);
    const databaseKeys=new Set(["database","database_name","db","db_name","dsn"]);
    const add=(type,value,keyPath) => {
      if (typeof value!=="string" || !value.trim()) return;
      const normalized=value.trim();
      const identity=`${type}:${normalized}`;
      if (seen.has(identity) || resources.length>=6) return;
      seen.add(identity);
      resources.push({type,value:normalized,keyPath});
    };
    const visit=(value,path,depth) => {
      if (depth>3 || resources.length>=6 || !value || typeof value!=="object") return;
      Object.entries(value).forEach(([key,child]) => {
        const normalizedKey=key.toLowerCase();
        const keyPath=[...path,key].join(".");
        const values=Array.isArray(child)?child: [child];
        if (fileKeys.has(normalizedKey)) values.forEach(item=>add("File",item,keyPath));
        else if (urlKeys.has(normalizedKey)) values.forEach(item=>add("URL",item,keyPath));
        else if (databaseKeys.has(normalizedKey)) values.forEach(item=>add("Database",item,keyPath));
        if (child && typeof child==="object") visit(child,[...path,key],depth+1);
      });
    };
    visit(asObject(event.content),["content"],0);
    visit(asObject(event.metadata),["metadata"],0);
    return resources;
  }

  function normalizeNebulaResource(type,value) {
    const normalized=String(value || "").trim().replace(/\\/g,"/");
    if (type==="URL") {
      try { const url=new URL(normalized);url.hostname=url.hostname.toLowerCase();return url.toString().replace(/\/$/,""); }
      catch { return normalized; }
    }
    return type==="File"?normalized.replace(/\/{2,}/g,"/"):normalized.toLowerCase();
  }

  function collectNebulaResources(events) {
    const resourcesByIdentity=new Map();
    events.forEach(event => extractNebulaResources(event).forEach(resource => {
      const normalizedValue=normalizeNebulaResource(resource.type,resource.value);
      const identity=`${resource.type}:${normalizedValue}`;
      if (!resourcesByIdentity.has(identity)) resourcesByIdentity.set(identity,{...resource,normalizedValue,identity,eventIds:new Set(),keyPaths:new Set()});
      const collected=resourcesByIdentity.get(identity);
      collected.eventIds.add(event.event_id);
      collected.keyPaths.add(resource.keyPath);
    }));
    return [...resourcesByIdentity.values()].map(resource=>({...resource,eventIds:[...resource.eventIds],keyPaths:[...resource.keyPaths]}));
  }

  function nebulaEventCode(event,kind) {
    if (kind==="input") return "IN";
    if (kind==="output") return "OUT";
    if (String(event.stage).toLowerCase()==="tool_result") return "RESULT";
    const module=String(event.source_module || "").toLowerCase();
    if (module.includes("access_control")) return "ACL";
    if (module.includes("tool_guard")) return "TOOL";
    if (module.includes("retrieval_guard")) return "RAG";
    if (module.includes("context")) return "CTX";
    if (module.includes("io_guard.input")) return "IO-IN";
    if (module.includes("io_guard.output")) return "IO-OUT";
    if (module.includes("audit")) return "AUDIT";
    return compact(module.split(/[._-]/).filter(Boolean).map(part=>part[0]).join("").toUpperCase() || "EVT",7);
  }

  function nebulaToolVerb(events) {
    const name=timelineGroupToolName({items:events.map((event,index)=>({node:event,index}))});
    const normalized=String(name || "tool").trim().toLowerCase().replace(/[^a-z0-9_-]+/g,"_");
    const aliases={workspace_reader:"read",file_reader:"read",read_file:"read",external_export:"export",web_fetch:"web_fetch",database_query:"db_query"};
    if (aliases[normalized]) return aliases[normalized];
    if (normalized.includes("export")) return "export";
    if (normalized.endsWith("reader")) return "read";
    if (normalized.includes("fetch")) return normalized.includes("web")?"web_fetch":"fetch";
    return normalized.length<=14?normalized:`${normalized.slice(0,12)}..`;
  }

  function nebulaOrbitRadius(count,nodeSpan,minimum) {
    const actualCount=Math.max(1,count);
    return Math.max(minimum+(actualCount-1)*6,Math.ceil((actualCount*(nodeSpan+18))/(Math.PI*2)));
  }

  function placeNebulaToolGroups(groups,center,coreRadius) {
    const placed=[];
    const angles=[-.22*Math.PI,.78*Math.PI,.22*Math.PI,-.78*Math.PI,-.5*Math.PI,.5*Math.PI,0,Math.PI];
    [...groups].sort((a,b)=>b.radius-a.radius).forEach((group,index) => {
      let distance=coreRadius+group.radius+118;
      let angle=angles[index%angles.length]+Math.floor(index/angles.length)*.31;
      let candidate=null;
      for (let attempt=0;attempt<24;attempt+=1) {
        candidate={x:center.x+Math.cos(angle)*distance,y:center.y+Math.sin(angle)*distance};
        const clearsCore=Math.hypot(candidate.x-center.x,candidate.y-center.y)>=coreRadius+group.radius+82;
        const clearsGroups=placed.every(other=>Math.hypot(candidate.x-other.cx,candidate.y-other.cy)>=group.radius+other.radius+72);
        if (clearsCore&&clearsGroups) break;
        distance+=38;
        angle+=.37;
      }
      group.cx=candidate.x;group.cy=candidate.y;placed.push(group);
    });
  }

  function buildNebulaProjection(trace,width,height) {
    const ordered=orderedNodes(trace);
    const nodes=[];
    const nodeById=new Map();
    const toolGroups=new Map();
    const collapsed=nebulaCollapsedSet(trace?.trace_id);
    const addNode=node => { nodes.push(node);nodeById.set(node.id,node);return node; };
    ordered.forEach((event,index) => {
      const toolCallId=timelineToolCallId(event);
      if (toolCallId && !toolGroups.has(toolCallId)) toolGroups.set(toolCallId,{id:toolCallId,index:toolGroups.size,events:[]});
      if (toolCallId) toolGroups.get(toolCallId).events.push(event);
      const kind=isTimelineInput(event)?"input":isTimelineOutput(event)?"output":"event";
      addNode({id:event.event_id,kind,event,toolCallId,groupKey:toolCallId?`tool:${toolCallId}`:"trace",label:nebulaEventCode(event,kind),radius:18+Math.min(1,Math.max(0,number(event.risk_score)))*10,collisionRadius:34+Math.min(1,Math.max(0,number(event.risk_score)))*10,order:index,hidden:Boolean(toolCallId&&collapsed.has(toolCallId)),projection:false});
    });
    toolGroups.forEach(group => {
      group.code=`T${String(group.index+1).padStart(2,"0")}`;
      group.toolVerb=nebulaToolVerb(group.events);
      group.resources=collectNebulaResources(group.events);
      group.innerEvents=group.events.filter(event=>String(event.stage).toLowerCase()!=="tool_result");
      group.outerEvents=group.events.filter(event=>String(event.stage).toLowerCase()==="tool_result");
      group.innerOrbit=nebulaOrbitRadius(group.innerEvents.length,56,76);
      group.outerOrbit=Math.max(group.innerOrbit+64,nebulaOrbitRadius(group.outerEvents.length+group.resources.length,48,118));
      group.radius=collapsed.has(group.id)?54:group.outerOrbit+48;
    });
    const maximumGroupRadius=Math.max(120,...[...toolGroups.values()].map(group=>group.radius));
    const layoutWidth=Math.max(width,maximumGroupRadius*4+560);
    const layoutHeight=Math.max(height,maximumGroupRadius*3+350);
    const center={x:layoutWidth/2,y:layoutHeight/2};
    const core=addNode({id:"nebula:trace-core",kind:"core",label:"TRACE CORE",radius:58,collisionRadius:78,x:center.x,y:center.y,ax:center.x,ay:center.y,fixed:true,projection:true});
    placeNebulaToolGroups([...toolGroups.values()],center,core.radius);
    toolGroups.forEach(group => addNode({id:`nebula:tool:${group.id}`,kind:"tool",toolCallId:group.id,groupKey:`tool:${group.id}`,label:group.code,radius:31,collisionRadius:45,x:group.cx,y:group.cy,ax:group.cx,ay:group.cy,fixed:true,projection:true,collapsed:collapsed.has(group.id)}));
    const traceEvents=nodes.filter(node=>node.event&&!node.toolCallId);
    let traceFreeIndex=0;
    traceEvents.forEach(node => {
      if (node.kind==="input") { node.ax=center.x-(maximumGroupRadius+core.radius+205);node.ay=center.y-76; }
      else if (node.kind==="output") { node.ax=center.x+(maximumGroupRadius+core.radius+205);node.ay=center.y+76; }
      else { const angle=-Math.PI/2+traceFreeIndex*Math.PI*.72;node.ax=center.x+Math.cos(angle)*(core.radius+92);node.ay=center.y+Math.sin(angle)*(core.radius+92);traceFreeIndex+=1; }
    });
    toolGroups.forEach(group => {
      group.innerEvents.forEach((event,index) => {
        const node=nodeById.get(event.event_id),angle=-Math.PI/2+(index/Math.max(1,group.innerEvents.length))*Math.PI*2;
        node.ax=group.cx+Math.cos(angle)*group.innerOrbit;node.ay=group.cy+Math.sin(angle)*group.innerOrbit;
      });
      group.outerEvents.forEach((event,index) => {
        const node=nodeById.get(event.event_id),count=Math.max(1,group.outerEvents.length+group.resources.length),angle=-Math.PI/2+(index/count)*Math.PI*2;
        node.ax=group.cx+Math.cos(angle)*group.outerOrbit;node.ay=group.cy+Math.sin(angle)*group.outerOrbit;
      });
    });
    nodes.forEach(node => {
      if (node.x===undefined) {
        node.x=node.ax;node.y=node.ay;
      }
      node.vx=0;node.vy=0;
    });
    const edges=[];
    asArray(trace?.edges).forEach((edge,index) => {

[project]
name = "input-output-guard"
version = "0.2.0"
description = "Three-stage input, context, and output guard for Clawguard."
requires-python = ">=3.11,<3.12"
dependencies = [
    "joblib>=1.3,<2",
    "pydantic>=2.7,<3",
    "scikit-learn>=1.4,<2",
]

[project.scripts]
io-guard-service = "io_guard.service:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
